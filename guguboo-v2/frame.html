<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guguboo V2</title>
  <!-- V2 – rámček telefónu pre širokú obrazovku (Samuel 10. 11. 2026). Appka beží vo vnútri ako na mobile.
       Rámček má vždy rozmer telefónu (430 × 900); pri menšom okne sa celý zmenší, nikdy nestlačí. -->
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 20% 15%, #f6f0ff 0, transparent 45%), radial-gradient(circle at 85% 85%, #fff1ec 0, transparent 45%), #fbf8f6;
    }
    .stage { position: absolute; top: 50%; left: 50%; width: 430px; height: 900px; transform-origin: center center; transform: translate(-50%, -50%) scale(var(--scale, 1)); }
    .phone {
      display: block;
      width: 430px;
      height: 900px;
      border: 0;
      border-radius: 36px;
      background: #fff;
      box-shadow: 0 30px 80px rgba(48, 36, 67, .18), 0 0 0 10px #fff, 0 0 0 11px rgba(123, 97, 200, .14);
    }
  </style>
</head>
<body>
  <div class="stage"><iframe class="phone" src="app.html?frame=1" title="Guguboo" allow="microphone; camera; clipboard-write; web-share; fullscreen"></iframe></div>
  <script>
    // Hash (#...) z adresy pošli do appky v rámčeku.
    if (window.location.hash) document.querySelector(".phone").src = "app.html?frame=1" + window.location.hash;
    // Zmenšenie celého telefónu podľa okna (okraj 24 px okolo).
    function fit() {
      const scale = Math.min(1, (window.innerHeight - 48) / 900, (window.innerWidth - 48) / 430);
      document.querySelector(".stage").style.setProperty("--scale", String(Math.max(.4, scale)));
    }
    fit();
    window.addEventListener("resize", fit);
  </script>
</body>
</html>

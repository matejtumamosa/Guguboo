<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guguboo V2</title>
  <!-- V2 – rámček telefónu pre širokú obrazovku (Samuel 10. 11. 2026): výška iPhone 16 Pro (874 bodov), o ~1 cm širší (450) – Samuel 10. 11.: „je to strašne úzke“.
       Celý telefón sa zmenší tak, aby bol vždy celý na jednej obrazovke. -->
  <script>
    // Na telefóne (úzka obrazovka) rámček netreba – rovno appka na celú obrazovku.
    if (window.top === window.self && Math.min(window.innerWidth, screen.width) <= 560) window.location.replace("app.html" + window.location.hash);
  </script>
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 20% 15%, #f6f0ff 0, transparent 45%), radial-gradient(circle at 85% 85%, #fff1ec 0, transparent 45%), #fbf8f6;
    }
    .stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 450px;
      height: 874px;
      overflow: hidden;
      border-radius: 54px;
      box-shadow: 0 24px 60px rgba(48, 36, 67, .16), 0 0 0 10px #fff, 0 0 0 11px rgba(123, 97, 200, .14);
      transform: translate(-50%, -50%) scale(var(--scale, 1));
    }
    .phone { display: block; width: 450px; height: 874px; border: 0; background: #fff; }
  </style>
</head>
<body>
  <div class="stage"><iframe class="phone" src="app.html?frame=1" title="Guguboo" allow="microphone; camera; clipboard-write; web-share; fullscreen"></iframe></div>
  <script>
    // Hash (#...) z adresy pošli do appky v rámčeku.
    if (window.location.hash) document.querySelector(".phone").src = "app.html?frame=1" + window.location.hash;
    // Zmenšenie celého telefónu, aby sa zmestil do okna (okraj 24 px).
    function fit() {
      const scale = Math.min(1, (window.innerHeight - 32) / 874, (window.innerWidth - 32) / 450);
      document.querySelector(".stage").style.setProperty("--scale", String(Math.max(.3, scale)));
    }
    fit();
    window.addEventListener("resize", fit);
  </script>
</body>
</html>

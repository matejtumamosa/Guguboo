<!-- Prototyp kruhu „Čas pre teba“ (Samo 13. 11.): reálne fungujúce akcie, overený obsah priamo z appky (content/*.js). Nie je súčasťou appky. -->
<script src="content/pregnancy-weeks.js"></script>
<script src="content/mama-tehotenstvo.js"></script>

<style>
:root { --bg: #fbf8f7; --surface: #fff; --soft: #f6f2ff; --ink: #29243a; --muted: #5d5768; --line: #e9e3f3; --brand: #6a5bbf; --brand-ink: #5f4fb1;
  --rest: #e9a3b8; --body: #f0b07c; --sup: #93a8e6; --f: Montserrat, "Segoe UI", system-ui, sans-serif; }
body.night { --bg: #141826; --surface: #212638; --soft: #2a2f42; --ink: #f5f2fb; --muted: #c9c3d8; --line: #343a50; --brand-ink: #c6bcff; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.5 var(--f); }
body { padding: 0 16px calc(24px + env(safe-area-inset-bottom)); max-width: 460px; margin: 0 auto; transition: background .3s; }
.ctl { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 0 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.ctl b { font-size: 13px; color: var(--muted); font-weight: 700; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill { min-height: 40px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--surface); color: var(--ink); font: 700 14px/1 var(--f); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.pill[aria-pressed="true"] { background: var(--brand); color: #fff; box-shadow: none; }
input[type=range] { flex: 1; accent-color: var(--brand); min-height: 32px; }
h1 { font-size: 22px; margin: 16px 0 4px; }
.note { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.card { background: var(--surface); border-radius: 24px; padding: 16px; box-shadow: 0 6px 20px rgba(60,40,90,.06); }
.card > small { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--brand-ink); }
.ringwrap { display: grid; place-items: center; position: relative; margin: 8px 0; }
svg.ring { width: min(78vw, 280px); height: auto; }
.seg { cursor: pointer; } .seg:focus-visible { outline: none; stroke: var(--brand); stroke-width: 5; }
.lab { font: 800 15px/1 var(--f); fill: #fff; pointer-events: none; }
.center { position: absolute; width: 31%; aspect-ratio: 1; border-radius: 50%; border: 0; background: linear-gradient(145deg, #f3effd, #ddd3f6); color: #29243a; font: 800 15px/1.15 var(--f); cursor: pointer; box-shadow: 0 6px 18px rgba(80,60,120,.2); }
.quick { display: grid; gap: 10px; }
.now { min-height: 76px; border-radius: 22px; border: 0; background: linear-gradient(135deg, #7b6bc8, #9a8ad8); color: #fff; font: 800 18px/1.2 var(--f); text-align: left; padding: 14px 18px; cursor: pointer; }
.now small { display: block; font: 600 14px/1.3 var(--f); opacity: .9; margin-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.tile { min-height: 92px; border-radius: 20px; border: 0; color: #29243a; font: 700 15px/1.2 var(--f); cursor: pointer; padding: 10px 8px; }
.t1 { background: #fde4ec; } .t2 { background: #ffe8d4; } .t3 { background: #e3eafc; }
.scrim { position: fixed; inset: 0; background: rgba(20,16,30,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 50%; bottom: 0; width: min(100%, 460px); transform: translate(-50%, 105%); transition: transform .25s; background: var(--bg); color: var(--ink); border-radius: 26px 26px 0 0; padding: 10px 16px calc(22px + env(safe-area-inset-bottom)); max-height: 88dvh; overflow: auto; z-index: 11; }
.sheet.on { transform: translate(-50%, 0); }
.grip { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 2px auto 10px; }
.sh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sh h2 { margin: 0; font-size: 20px; }
.x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); font: 700 20px/1 var(--f); cursor: pointer; }
.lead { color: var(--muted); margin: 4px 0 12px; }
.act { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 10px 14px; margin-bottom: 8px; border-radius: 18px; border: 0; background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; font: 700 16px/1.25 var(--f); }
.act i { flex: 0 0 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-style: normal; background: var(--soft); }
.act small { display: block; font: 500 14px/1.3 var(--f); color: var(--muted); }
.act.big { min-height: 76px; background: var(--brand); color: #fff; } .act.big small { color: #eee; } .act.big i { background: rgba(255,255,255,.2); }
.moods { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.moods button { min-height: 40px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--surface); color: var(--ink); font: 600 14px/1 var(--f); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.moods button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--brand); }
.small { font-size: 14px; color: var(--muted); }
.breath { display: grid; place-items: center; height: 260px; }
.bubble { width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #c9bdf3); box-shadow: 0 0 40px rgba(150,130,220,.4); transform: scale(.65); }
.bubble.run { animation: br 10s ease-in-out infinite; }
@keyframes br { 0%,100% { transform: scale(.65); } 40% { transform: scale(1.2); } 50% { transform: scale(1.2); } }
.cue { text-align: center; font: 700 20px/1.2 var(--f); min-height: 26px; }
.timer { font: 800 48px/1 var(--f); text-align: center; margin: 14px 0; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.btn { width: 100%; min-height: 52px; border: 0; border-radius: 16px; background: var(--brand); color: #fff; font: 700 16px/1 var(--f); cursor: pointer; margin-top: 10px; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
textarea { width: 100%; min-height: 100px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 500 16px/1.45 var(--f); padding: 12px; }
.info { background: var(--surface); border-radius: 18px; padding: 14px 16px; margin-bottom: 10px; }
.info h3 { margin: 0 0 6px; font-size: 16px; }
.info ul { margin: 0; padding-left: 20px; } .info li { margin: 4px 0; }
.src { font-size: 13px; color: var(--muted); margin-top: 8px; }
.src a { color: var(--brand-ink); }
.dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 2s; z-index: 20; display: grid; place-items: center; color: #8b84a0; font: 600 16px/1.4 var(--f); text-align: center; }
.dim.on { opacity: .92; pointer-events: auto; }
.step { font: 600 18px/1.5 var(--f); min-height: 110px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; width: min(92%, 420px); padding: 12px 14px; border-radius: 14px; background: #29243a; color: #fff; font-weight: 600; z-index: 30; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .bubble.run { animation-duration: 14s; } .sheet, .scrim { transition: none; } }
</style>
</head>
<body>
<div class="ctl">
  <div class="row"><b>Varianta:</b>
    <button class="pill" data-arch="ring" aria-pressed="true">Kruh</button>
    <button class="pill" data-arch="quick" aria-pressed="false">Rýchla pomoc</button>
  </div>
  <div class="row"><b>Obdobie:</b>
    <button class="pill" data-ph="preg" aria-pressed="true">Tehotenstvo</button>
    <button class="pill" data-ph="born" aria-pressed="false">Po pôrode</button>
    <button class="pill" data-night aria-pressed="false">Noc</button>
  </div>
  <div class="row"><b id="sliderLabel">Týždeň: 20</b><input type="range" id="slider" min="4" max="41" value="20" aria-labelledby="sliderLabel"></div>
</div>

<h1>Čas pre teba</h1>
<p class="note">Prototyp so skutočnými akciami: dýchanie, šum, časovač, odoslanie prosby cez telefón. Obsah Tela je priamo z overených textov appky (NHS). Nič sa neukladá.</p>

<section class="card" id="ringCard">
  <small>Čas pre teba</small>
  <div class="ringwrap">
    <svg class="ring" viewBox="0 0 260 260" aria-label="Kruh Čas pre teba">
      <path class="seg" data-s="rest" tabindex="0" role="button" aria-label="Oddych" fill="#e9a3b8"/>
      <path class="seg" data-s="body" tabindex="0" role="button" aria-label="Telo" fill="#f0b07c"/>
      <path class="seg" data-s="sup" tabindex="0" role="button" aria-label="Opora" fill="#93a8e6"/>
      <text class="lab" id="l-rest">Oddych</text><text class="lab" id="l-body">Telo</text><text class="lab" id="l-sup">Opora</text>
    </svg>
    <button class="center" type="button" data-center>Teraz</button>
  </div>
</section>

<section class="card quick" id="quickCard" hidden>
  <small>Čas pre teba</small>
  <button class="now" type="button" data-center><span id="nowT">Chvíľa pokoja</span><small id="nowS">Dýchaj so mnou · 1 minúta</small></button>
  <div class="tiles">
    <button class="tile t1" type="button" data-s="rest">Upokojiť sa</button>
    <button class="tile t2" type="button" data-s="body">Moje telo teraz</button>
    <button class="tile t3" type="button" data-s="sup">Poprosiť o pomoc</button>
  </div>
</section>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="grip" aria-hidden="true"></div>
  <div class="sh"><h2 id="shT"></h2><button class="x" type="button" id="close" aria-label="Zavrieť">×</button></div>
  <div id="shB"></div>
</section>
<div class="dim" id="dim" role="button" aria-label="Ťukni pre zastavenie šumu"><div>Šum hrá<br><span id="dimT"></span><br><br>Ťukni kamkoľvek a šum sa zastaví</div></div>
<div class="toast" id="toast" hidden></div>

<script>
const C = window.GugubooContent || {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const text = v => Array.isArray(v) ? v.map(x => x?.sk || x).filter(Boolean).join(" ") : (v?.sk || (typeof v === "string" ? v : ""));
let phase = "preg", night = false, value = 20, arch = "ring", mood = "";
const toast = t => { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3200); };

/* —— kruh —— */
const cx = 130, cy = 130, R = 120, r = 50;
const arc = (a0, a1) => { const p = (a, rad) => [cx + rad * Math.cos(a * Math.PI / 180), cy + rad * Math.sin(a * Math.PI / 180)];
  const [x0, y0] = p(a0 + 2, R), [x1, y1] = p(a1 - 2, R), [x2, y2] = p(a1 - 2, r), [x3, y3] = p(a0 + 2, r);
  return `M${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 0 0 ${x3} ${y3}Z`; };
Object.entries({ rest: [-90, 30], body: [30, 150], sup: [150, 270] }).forEach(([k, [a0, a1]]) => {
  document.querySelector(`.seg[data-s="${k}"]`).setAttribute("d", arc(a0, a1));
  const m = (a0 + a1) / 2 * Math.PI / 180, t = $("l-" + k);
  t.setAttribute("x", cx + 86 * Math.cos(m)); t.setAttribute("y", cy + 86 * Math.sin(m) + 5); t.setAttribute("text-anchor", "middle");
});

/* —— zvuk: hnedý šum a jemný gong (Web Audio, žiadne súbory) —— */
let ac, noise, gain, stopAt, tick;
function audio() { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); return ac; }
function startNoise(minutes) {
  stopNoise(); const a = audio(); const len = a.sampleRate * 4, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0); let last = 0;
  for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.2; }
  noise = a.createBufferSource(); noise.buffer = buf; noise.loop = true; gain = a.createGain(); gain.gain.setValueAtTime(0, a.currentTime); gain.gain.linearRampToValueAtTime(.35, a.currentTime + 6);
  noise.connect(gain).connect(a.destination); noise.start();
  stopAt = Date.now() + minutes * 60000; $("dim").classList.add("on");
  clearInterval(tick); tick = setInterval(() => { const s = Math.max(0, Math.round((stopAt - Date.now()) / 1000)); $("dimT").textContent = "ešte " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); if (s <= 0) stopNoise(true); }, 500);
}
function stopNoise(fade) {
  clearInterval(tick); $("dim").classList.remove("on");
  if (noise && gain && ac) { const n = noise; gain.gain.cancelScheduledValues(ac.currentTime); gain.gain.setValueAtTime(gain.gain.value, ac.currentTime); gain.gain.linearRampToValueAtTime(0, ac.currentTime + (fade ? 8 : .4)); setTimeout(() => { try { n.stop(); } catch (e) {} }, fade ? 8200 : 500); }
  noise = null;
}
function chime() { try { const a = audio(); [523, 659].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(0, a.currentTime + i * .5); g.gain.linearRampToValueAtTime(.18, a.currentTime + i * .5 + .05); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + i * .5 + 2.5); o.connect(g).connect(a.destination); o.start(a.currentTime + i * .5); o.stop(a.currentTime + i * .5 + 2.6); }); } catch (e) {} }

/* —— okno —— */
let timer;
function open(title, html, lead) { clearInterval(timer); $("shT").textContent = title; $("shB").innerHTML = (lead ? `<p class="lead">${lead}</p>` : "") + html; $("sheet").classList.add("on"); $("scrim").classList.add("on"); $("sheet").scrollTop = 0; setTimeout(() => $("close").focus(), 60); }
function close() { clearInterval(timer); $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); }
const act = (data, ic, t, s, big) => `<button class="act${big ? " big" : ""}" type="button" data-a="${data}"><i aria-hidden="true">${ic}</i><span>${esc(t)}${s ? `<small>${esc(s)}</small>` : ""}</span></button>`;

/* —— obsah z appky —— */
const week = () => phase === "preg" ? value : 0;
const days = () => phase === "born" ? value : 0;
const pw = () => C.pregnancyWeeks?.weeks?.[Math.min(42, Math.max(4, week()))];
const breathText = () => text(C.pregnancyWeeks?.weeks?.[40]?.tip) || "";
const source = (url, reviewed) => url ? `<p class="src">Zdroj: <a href="${esc(url)}" target="_blank" rel="noopener">NHS</a>${reviewed ? " · kontrola NHS " + esc(reviewed) : ""}</p>` : "";

/* —— prosby (UX Architekt) —— */
function requests() {
  if (phase === "preg") return ["Môžeš dnes nakúpiť namiesto mňa? Potrebujem si oddýchnuť.", "Môžeš dnes pripraviť večeru? Ďakujem.", "Môžeš sa dnes postarať o domácnosť, kým si ľahnem s nohami hore?"].concat(week() >= 28 ? ["Pomôžeš mi tento týždeň pripraviť miesto, kde bude bábätko spať?"] : []);
  return ["Môžeš na 20 minút prevziať bábätko? Potrebujem si ľahnúť.", "Dnes nestíham jedlo. Môžeš cestou niečo kúpiť alebo uvariť?", "Môžeš ísť dnes s kočíkom von? Potrebujem chvíľu ticha.", "Vymeníme sa dnes v noci pri vstávaní?"];
}
const CAUTION = "Ak ťa pri cvičení niečo bolí, krvácaš alebo ti nie je dobre, prestaň a poraď sa so svojím gynekológom alebo pôrodnou asistentkou.";
const friendMsgs = ["Myslím na teba. Máš dnes chvíľu na telefonát?", "Potrebujem sa s niekým porozprávať. Zavoláš mi, keď budeš mať chvíľu?"];

/* —— sekcie —— */
function section(k) {
  if (k === "rest") return open("Oddych", act("breath", "◌", "Dýchaj so mnou", "1 minúta, len sleduj krúžok") + act("nap", "☾", "Zdriemni si so šumom", "šum sa pomaly zosilní, potom sám stíchne") + (night ? "" : act("quiet", "⏱", "Chvíľa ticha", "5, 10 alebo 15 minút")));
  if (k === "sup") return open("Opora", act("ask", "✉", "Poprosiť o pomoc", "hotová prosba, upravíš a pošleš") + (night ? "" : act("friend", "♡", "Napísať blízkemu", "krátka správa")) + act("hard", "☏", "Keď je mi ťažko", "kontakty na pomoc"));
  // Posudok Content & Safety (13. 11.): v kruhu len činnosť, informácie (telo, ťažkosti, vitamíny, kontrola) sú v Mame – kruh nie je zdravotná poradňa.
  if (k === "body") {
    const mamaLink = `<button class="act" type="button" data-a="mama"><i aria-hidden="true">›</i><span>Viac o tele v Mame<small>tvoje telo, ťažkosti, jedlo a pohyb</small></span></button>`;
    if (night) return open("Telo", `<p class="lead">V noci nič necvič. Skús radšej Oddych.</p>` + act("breath", "◌", "Dýchaj so mnou", "1 minúta") + mamaLink);
    if (phase === "preg") return open("Telo", act("walk", "↟", "Krátka prechádzka", "10 minút, časovač ťa upozorní") + mamaLink);
    return open("Telo", act("pp-pelvic", "↟", "Panvové dno so mnou", "krok za krokom") + mamaLink);
  }
}
function centerTap() {
  if (night) return open("Nočná chvíľka", act("nap", "☾", "Šum na zaspávanie", "pomaly sa zosilní, 20 minút", true) + act("breath", "◌", "Dýchaj so mnou", "1 minúta") + (phase === "born" ? act("ask-night", "✉", "Vymeníme sa pri ďalšom zobudení?", "prosba blízkemu") : ""));
  const order = { "Unavená": phase === "born" ? "nap" : "nap", "Napätá": "breath", "Smutná": "friend", "V pohode": "quiet" };
  const first = mood ? order[mood] : (phase === "born" ? "nap" : "breath");
  const big = { breath: ["◌", "Dýchaj so mnou", "1 minúta"], nap: ["☾", phase === "born" ? "Zdriemni si, kým spí" : "Zdriemni si so šumom", "šum sa pomaly zosilní"], friend: ["♡", "Napísať blízkemu", "krátka správa"], quiet: ["⏱", "Chvíľa ticha", "5, 10 alebo 15 minút"] }[first];
  open("Čo ti teraz pomôže?", act(first, big[0], big[1], big[2], true) + act("ask", "✉", "Poprosiť o pomoc", "hotová prosba") + act("hard", "☏", "Keď je mi ťažko", "kontakty na pomoc") +
    `<p class="small" style="margin:14px 0 4px">Chceš povedať, ako sa máš? (nepovinné, nič sa neukladá)</p><div class="moods">${["Unavená", "Napätá", "Smutná", "V pohode"].map(m => `<button type="button" data-mood="${m}" aria-pressed="${m === mood}">${m}</button>`).join("")}</div>`);
}

/* —— akcie —— */
function doAct(a) {
  if (a === "breath") {
    const tip = breathText();
    open("Dýchaj so mnou", `<div class="breath"><div class="bubble" id="bub" aria-hidden="true"></div></div><p class="cue" id="cue" aria-live="polite">Pripravená?</p><p class="small" style="text-align:center">${esc(tip || "Dýchaj pokojne nosom a pomaly vydychuj ústami.")}</p><button class="btn" type="button" data-a="breath-go">Začať · 1 minúta</button>${tip ? source("https://www.nhs.uk/pregnancy/week-by-week/", "") : ""}<p class="small">Rytmus krúžku je pokojný, nie lekársky pokyn. Pred nasadením ho oprieme o overený zdroj.</p>`);
  }
  if (a === "breath-go") {
    const b = $("bub"), cue = $("cue"); b.classList.add("run"); let t = 0; clearInterval(timer);
    const step = () => { const p = t % 10; cue.textContent = p < 4 ? "Nádych…" : p < 5 ? "…" : "Výdych…"; if (t >= 60) { clearInterval(timer); b.classList.remove("run"); cue.textContent = "Hotovo. Pekne pokojne."; chime(); } t++; };
    step(); timer = setInterval(step, 1000);
  }
  if (a === "nap") open(phase === "born" ? "Zdriemni si, kým spí" : "Zdriemni si so šumom", `<div class="chips">${[20, 45].map((m, i) => `<button class="pill" type="button" data-nap="${m}" aria-pressed="${i === 0}">${m} minút</button>`).join("")}</div><button class="btn" type="button" data-a="nap-go">Spustiť šum</button><p class="small">Šum sa 6 sekúnd zosilňuje a na konci sám pomaly stíchne. Obrazovka stmavne. Zvuk vychádza z telefónu, nie zo súboru.</p>`);
  if (a === "nap-go") { const m = +document.querySelector("[data-nap][aria-pressed=true]").dataset.nap; close(); startNoise(m); }
  if (a === "quiet") open("Chvíľa ticha", `<div class="chips">${[5, 10, 15].map((m, i) => `<button class="pill" type="button" data-q="${m}" aria-pressed="${i === 1}">${m} min</button>`).join("")}</div><div class="timer" id="tm">10:00</div><button class="btn" type="button" data-a="quiet-go">Začať</button><p class="small">Na konci zaznie jemný tón. Telefón môžeš položiť.</p>`);
  if (a === "quiet-go") { let s = +document.querySelector("[data-q][aria-pressed=true]").dataset.q * 60; audio(); clearInterval(timer); const show = () => $("tm").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); show(); timer = setInterval(() => { s--; show(); if (s <= 0) { clearInterval(timer); chime(); $("tm").textContent = "Hotovo"; } }, 1000); }
  if (a === "ask" || a === "friend" || a === "ask-night") {
    const list = a === "friend" ? friendMsgs : a === "ask-night" ? ["Vymeníme sa pri ďalšom zobudení? Potrebujem sa vyspať."] : requests();
    open(a === "friend" ? "Napísať blízkemu" : "Poprosiť o pomoc", `<div class="moods" id="rq">${list.map((t, i) => `<button type="button" data-rq="${i}" aria-pressed="${i === 0}">${["1", "2", "3", "4"][i]}</button>`).join("")}</div><p class="small" style="margin:12px 0 6px">Uprav si text, ak chceš:</p><textarea id="rqt" aria-label="Text správy">${esc(list[0])}</textarea><button class="btn" type="button" data-a="send">Poslať cez telefón</button><button class="btn ghost" type="button" data-a="copy">Skopírovať text</button><p class="small">Otvorí sa zdieľanie telefónu (Správy, WhatsApp…). Appka nič neposiela sama a nevie, či si správu odoslala.</p>`);
    $("rq").onclick = e => { const b = e.target.closest("[data-rq]"); if (!b) return; $("rq").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); $("rqt").value = list[+b.dataset.rq]; };
  }
  if (a === "send") { const t = $("rqt").value.trim(); if (navigator.share) navigator.share({ text: t }).catch(() => {}); else { location.href = "sms:?&body=" + encodeURIComponent(t); } }
  if (a === "copy") { const t = $("rqt").value.trim(); (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => toast("Text je skopírovaný. Vlož ho do správy."), () => { $("rqt").select(); toast("Označila som text – skopíruj ho."); }); }
  if (a === "hard") open("Keď je mi ťažko", `<div class="info"><p style="margin:0">Nemusíš to niesť sama. Linka dôvery Nezábudka je k dispozícii nonstop a bezplatne.</p><p style="margin:10px 0 0"><a class="btn" style="display:grid;place-items:center;text-decoration:none" href="tel:0800800566">Zavolať 0800 800 566</a></p></div>` + (phase === "born" && C.mamaPostpartum?.mood ? `<div class="info"><h3>Po pôrode</h3><p style="margin:0">${esc(C.mamaPostpartum.mood.blues)}</p><p class="small" style="margin-top:8px">${esc(C.mamaPostpartum.mood.help)}</p>${source(C.mamaPostpartum.mood.source, C.mamaPostpartum.mood.reviewed)}</div>` : "") + `<p class="small">Ak hrozí nebezpečenstvo, volaj 112.</p>`);
  /* Telo – tehotenstvo */
  if (a === "pw-you") {
    const w = pw(), you = text(w?.you), tip = text(w?.tip), v = C.mamaPregnancy?.vitamins; const month = new Date().getMonth();
    const vit = [week() <= 12 ? "Kyselina listová – NHS ju uvádza počas prvých 12 týždňov." : "", (month >= 9 || month <= 2) ? "Vitamín D – NHS ho uvádza od októbra do marca." : ""].filter(Boolean);
    open(week() + ". týždeň · tvoje telo", (you ? `<div class="info"><p style="margin:0">${esc(you)}</p></div>` : "<p>Pre tento týždeň nemáme overený text.</p>") + (tip ? `<div class="info"><h3>Tip na tento týždeň</h3><p style="margin:0">${esc(tip)}</p></div>` : "") + (vit.length ? `<div class="info"><h3>Vitamíny</h3><ul>${vit.map(x => `<li>${esc(x)}</li>`).join("")}</ul><p class="small" style="margin-top:6px">Aký prípravok a koľko, ti povie lekár alebo lekárnik.</p>${source(v?.source, v?.reviewed)}</div>` : "") + source("https://www.nhs.uk/pregnancy/week-by-week/", ""));
  }
  if (a === "pw-troubles" || a === "pp-troubles") {
    const list = (a === "pw-troubles" ? C.mamaPregnancy : C.mamaPostpartum)?.troubles || [];
    open("Niečo ma trápi", list.map(t => act("tr:" + (a === "pw-troubles" ? "p" : "b") + ":" + t.id, t.emoji || "•", t.title, "")).join(""));
  }
  if (a.startsWith("tr:")) {
    const [, which, id] = a.split(":"); const t = ((which === "p" ? C.mamaPregnancy : C.mamaPostpartum)?.troubles || []).find(x => x.id === id); if (!t) return;
    open(t.title, `<div class="info"><ul>${(t.tips || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` + (t.doctor?.length ? `<div class="info"><h3>${esc(t.doctorIntro || "Ozvi sa lekárovi")}</h3><ul>${t.doctor.map(x => `<li>${esc(x)}</li>`).join("")}</ul>${t.doctorNote ? `<p class="small">${esc(t.doctorNote)}</p>` : ""}</div>` : "") + (t.emergency ? `<div class="info"><p style="margin:0">${esc(t.emergency)}</p></div>` : "") + source(t.source, t.reviewed));
  }
  if (a === "pw-move") { const e = C.mamaPregnancy?.exercise || {}; open("Pohyb, ktorý je v pohode", `<div class="info"><p style="margin:0">${esc(e.moveExamples)}</p></div>` + (e.tips ? `<div class="info"><h3>Ako na to</h3><ul>${e.tips.map(x => `<li>${esc(Array.isArray(x) ? x.join(" – ") : x)}</li>`).join("")}</ul></div>` : "") + (e.avoid ? `<div class="info"><h3>Čomu sa vyhnúť</h3><ul>${e.avoid.map(x => `<li>${esc(Array.isArray(x) ? x.join(" – ") : x)}</li>`).join("")}</ul></div>` : "") + `<p class="small">${esc(e.note || "")}</p>` + source(e.source, e.reviewed)); }
  /* Telo – po pôrode */
  if (a === "pp-pelvic") {
    // Bezpečnostný rámec: po cisárskom reze sa cviky neponúkajú automaticky; appka nikdy netvrdí, že je cvičenie „bezpečné“.
    return open("Panvové dno so mnou", `<p class="lead">Rodila si cisárskym rezom?</p>` + act("pp-cs", "•", "Áno", "") + act("pp-pelvic-go", "•", "Nie", "") + `<p class="small">Nič sa neukladá – pýtame sa len teraz.</p>`);
  }
  if (a === "pp-cs") return open("Panvové dno", `<div class="info"><p style="margin:0">Po cisárskom reze sa o tom, kedy a ako začať cvičiť, poraď so svojím gynekológom alebo pôrodnou asistentkou.</p></div>` + act("breath", "◌", "Zatiaľ si skús chvíľu dýchať", "1 minúta") + `<button class="act" type="button" data-a="mama"><i aria-hidden="true">›</i><span>Telo po pôrode v Mame</span></button>`);
  if (a === "pp-pelvic-go") {
    const ex = C.mamaPostpartum?.exercises, it = ex?.items?.find(x => x.id === "pelvic"); if (!it) return;
    let i = 0; const render = () => { const long = /10 sekúnd|do 10/.test(it.steps[i]);
      $("shB").innerHTML = `<p class="lead">${esc(it.why)}</p><div class="info step"><p class="small" style="margin:0 0 6px">Krok ${i + 1} z ${it.steps.length}</p>${esc(it.steps[i])}${long ? `<div class="timer" id="hold">10</div><button class="btn ghost" type="button" data-a="hold">Spustiť 10 sekúnd</button>` : ""}</div>${i < it.steps.length - 1 ? `<button class="btn" type="button" data-a="next">Ďalej</button>` : `<div class="info"><p style="margin:0">${esc(it.dose)}</p></div>`}<div class="info"><h3>Zatiaľ vynechaj</h3><ul>${(ex.avoid || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><p class="small">${esc(CAUTION)}</p>${source(ex.source, ex.reviewed)}<p class="small">Podľa NHS (Spojené kráľovstvo). Na Slovensku sa poraď so svojím gynekológom alebo pôrodnou asistentkou.</p>`; };
    open(it.title, ""); render(); doAct.next = () => { i = Math.min(i + 1, it.steps.length - 1); render(); };
  }
  if (a === "next") doAct.next?.();
  if (a === "mama") { close(); toast("V appke sa otvorí Mama › Tvoje telo (overený obsah so zdrojom)."); }
  if (a === "walk") {
    const e = C.mamaPregnancy?.exercise || {};
    open("Krátka prechádzka", `<div class="timer" id="tm">10:00</div><button class="btn" type="button" data-a="walk-go">Ideme von</button><div class="info" style="margin-top:12px"><p style="margin:0">${esc(e.moveExamples || "")}</p><p class="small" style="margin:8px 0 0">Ak máš zdravotné obmedzenie alebo komplikácie v tehotenstve, najprv sa poraď so svojím gynekológom.</p></div><p class="small">${esc(CAUTION)}</p>${source(e.source, e.reviewed)}<p class="small">Podľa NHS (Spojené kráľovstvo). Na Slovensku sa poraď so svojím gynekológom.</p>`);
  }
  if (a === "walk-go") { let s = 600; audio(); clearInterval(timer); const show = () => $("tm").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); show(); timer = setInterval(() => { s--; show(); if (s <= 0) { clearInterval(timer); chime(); $("tm").textContent = "Pekná prechádzka"; } }, 1000); }
  if (a === "hold") { let s = 10; clearInterval(timer); timer = setInterval(() => { s--; $("hold").textContent = s; if (s <= 0) { clearInterval(timer); $("hold").textContent = "Uvoľni"; chime(); } }, 1000); }
  if (a === "pp-tired") { const m = C.mamaPostpartum?.mood || {}; open("Keď si unavená", `<div class="info"><ul>${(m.sleep || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>${source(m.sleepSource, m.sleepReviewed)}</div>` + act("ask", "✉", "Poprosiť o postráženie", "hotová prosba")); }
  if (a === "pp-check") { const c = C.mamaPostpartum?.check || {}; open("Pred kontrolou po pôrode", `<div class="info"><p style="margin:0">${esc(c.when)}</p></div><div class="info"><h3>Čo sa na nej preberá</h3><ul>${(c.items || []).map(x => `<li>${esc(Array.isArray(x) ? x.join(" – ") : x)}</li>`).join("")}</ul></div>` + source(c.source, c.reviewed)); }
}

/* —— ovládanie —— */
function syncCtl() {
  document.body.classList.toggle("night", night);
  $("ringCard").hidden = arch !== "ring"; $("quickCard").hidden = arch !== "quick";
  const sl = $("slider"); if (phase === "preg") { sl.min = 4; sl.max = 41; $("sliderLabel").textContent = "Týždeň: " + value; } else { sl.min = 1; sl.max = 120; $("sliderLabel").textContent = "Deň po pôrode: " + value; }
  sl.value = value;
  $("nowT").textContent = night ? "Nočná chvíľka" : "Chvíľa pokoja"; $("nowS").textContent = night ? "šum alebo dych" : (phase === "born" ? "Zdriemni si, kým spí" : "Dýchaj so mnou · 1 minúta");
}
document.addEventListener("click", e => {
  const t = e.target;
  const ar = t.closest("[data-arch]"); if (ar) { arch = ar.dataset.arch; document.querySelectorAll("[data-arch]").forEach(b => b.setAttribute("aria-pressed", b === ar)); syncCtl(); return; }
  const ph = t.closest("[data-ph]"); if (ph) { phase = ph.dataset.ph; value = phase === "preg" ? 20 : 14; document.querySelectorAll("[data-ph]").forEach(b => b.setAttribute("aria-pressed", b === ph)); syncCtl(); return; }
  if (t.closest("[data-night]")) { night = !night; t.closest("[data-night]").setAttribute("aria-pressed", night); syncCtl(); return; }
  if (t.closest("#dim")) { stopNoise(false); toast("Šum som zastavila."); return; }
  const s = t.closest("[data-s]"); if (s) return section(s.dataset.s);
  if (t.closest("[data-center]")) return centerTap();
  const md = t.closest("[data-mood]"); if (md) { mood = mood === md.dataset.mood ? "" : md.dataset.mood; return centerTap(); }
  const pick = t.closest("[data-nap],[data-q]"); if (pick) { pick.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === pick)); if (pick.dataset.q) $("tm").textContent = String(pick.dataset.q).padStart(2, "0") + ":00"; return; }
  const a = t.closest("[data-a]"); if (a) return doAct(a.dataset.a);
  if (t.closest("#close") || t === $("scrim")) close();
});
$("slider").addEventListener("input", e => { value = +e.target.value; syncCtl(); });
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("seg")) { e.preventDefault(); section(e.target.dataset.s); } if (e.key === "Escape") { close(); stopNoise(false); } });
syncCtl();
</script>
</body>
</html>

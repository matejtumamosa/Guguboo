<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Guguboo Master – testy</title>
  <!--
    GUGUBOO MASTER – TESTY (Master 2.8, Plán F1-0; Master 3.0: ikony a názvy)
    ==============================================
    Ako spustiť (po každej zmene appky):
      1. Spusti statický server v koreni repa (napr. http://localhost:8787/) – alebo otvor náhľad na Netlify.
      2. Otvor  guguboo-master/test.html  → testy bežia samé, výsledok je hore (zelené = OK, červené = chyba,
         oranžové = známy nález, ktorý čaká na rozhodnutie – nie je to chyba testu).
      3. Pred commitom má byť hore „Všetko zelené“. Pri červenej oprav chybu alebo uprav test (s dôvodom v komentári).
    Bezpečnosť údajov:
      - Appka sa v testoch spúšťa v rámci (iframe) s VLASTNÝM úložiskom v pamäti (náhrada localStorage/sessionStorage).
        Skutočné údaje guguboo-m-* sa nečítajú do appky ani neprepisujú. Ak by sa náhrada nepodarila, appka sa nespustí.
      - Poistka: pred testami sa odfotí skutočný stav guguboo-m-*, po testoch sa porovná a pri rozdiele obnoví.
        Počas testov preto nemaj appku otvorenú v inej karte (jej zápisy by poistka vrátila).
    Náhľad bez skutočných údajov (na ručnú kontrolu, napr. v okne 375 × 667):
      test.html?nahlad=pred | po | uvod | foto   (foto = po pôrode s testovacími fotkami; &noc=1 = nočný režim, &w=375&h=667 = pevná veľkosť rámca)
    Automaticky (bez klikania): výsledok je aj v <body data-vysledok="ok|chyba"> a v window.__g2TestResult.
    Nový test: pridaj ho do zoznamu SUITES nižšie – funkcia vráti nič (OK), vyhodí chybu (červené) alebo zavolá known(…).
  -->
  <style>
    body { font: 15px/1.45 Montserrat, "Segoe UI", system-ui, sans-serif; color: #29243a; margin: 0; padding: 16px; background: #faf8ff; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sum { padding: 12px 14px; border-radius: 14px; font-weight: 800; margin: 10px 0 16px; background: #eee; }
    .sum.ok { background: #e3f6ea; color: #1d6b3d; } .sum.chyba { background: #fde6ea; color: #9b2340; }
    section { background: #fff; border: 1px solid rgba(117, 96, 181, .14); border-radius: 16px; padding: 10px 14px; margin-bottom: 12px; }
    h2 { font-size: 16px; margin: 4px 0 8px; }
    .t { padding: 4px 0 4px 26px; position: relative; border-top: 1px solid #f1eef8; }
    .t::before { position: absolute; left: 4px; top: 4px; font-weight: 900; }
    .t.ok::before { content: "✓"; color: #1d8a4a; } .t.chyba::before { content: "✗"; color: #c62848; } .t.nalez::before { content: "!"; color: #c27a12; }
    .t small { display: block; color: #5d5768; white-space: pre-wrap; }
    .t.chyba small { color: #9b2340; }
    #g2tHost { position: fixed; left: -10000px; top: 0; } /* rámce testov sú mimo obrazovky, ale majú skutočnú veľkosť */
    body.nahlad { padding: 0; background: #ddd; } body.nahlad iframe { border: 0; display: block; margin: 0 auto; background: #fff; }
  </style>
</head>
<body>
<script>
(function g2Tests() {
  "use strict";
  // Prázdny rámec, do ktorého test zapíše appku (nič tu nesmie bežať ani deklarovať globálne premenné).
  if (/[?&]ramec=1/.test(location.search)) return;

  const PREFIX = "guguboo-m-";
  const DAY = 86400000;
  const params = new URLSearchParams(location.search);
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
  const iso = date => date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
  const addDays = (days, from = new Date()) => { const d = new Date(from); d.setDate(d.getDate() + days); return d; };
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  // Master 4.0 (Audit Z1–Z7, spresnené pravidlo Sama 27. 11. 2026): zakázané sú rozkazy, normy („by sa malo“), ciele,
  // počítadlá a hodnotenie (samohodnotenie). Zdrojovaná informácia v mäkkej forme („NHS uvádza najviac 200 mg“) je povolená.
  // health = zdravotný text (vtedy aj „cieľ“). Nález = oprava obsahu alebo vedomé rozhodnutie Sama.
  const FORBIDDEN = [
    [/(mala by si|by si mala|mal by si|by si mal)(?![\p{L}])/iu, "„mala by si“"],
    [/(by sa malo|malo by sa|by malo)(?![\p{L}])/iu, "norma „by sa malo“"],
    [/(^|[^\p{L}])(musíš|nesmieš|oddychuj|zdriemni si|nevyskakuj|obmedz|obleč|uber mu|zlož|utiahni|nenechávaj|sústreď sa|povzbuď|porozmýšľaj|stiahni|ľahni si|opakuj|prestaň|nepripisuj|skontroluj|dávaj na seba|drž)(?![\p{L}])/iu, "rozkaz"],
    [/\d+\s*minút (týždenne|denne)/i, "cieľ minút"],
    [/Väčšina (bábätiek|detí)[^.]{0,40}\bdo \d/i, "norma „Väčšina … do N“"],
    [/nerobí jeden alebo viac/i, "samohodnotenie míľnikov"],
    [/Dnes \d+-krát|Tento týždeň \d+ (min|-krát)/i, "počítadlo"]
  ];
  function forbidden(label, text, health) {
    const t = String(text || "");
    const list = FORBIDDEN.concat(health ? [[/(^|[^\p{L}])cieľ/iu, "cieľ"]] : []);
    return list.filter(([re]) => re.test(t)).map(([re, why]) => label + ": " + why + " – „" + (t.match(re)[0] || "") + "“");
  }
  function eq(actual, expected, msg) { if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error((msg ? msg + ": " : "") + "čakal som " + JSON.stringify(expected) + ", je " + JSON.stringify(actual)); }
  class Known extends Error {}
  const known = msg => { throw new Known(msg); };

  // ——— Úložisko v pamäti (náhrada localStorage/sessionStorage pre appku v rámci) ———
  // Hodnoty sú vlastné vlastnosti objektu, aby Object.keys(localStorage) fungovalo ako v prehliadači (g2-backup.js ho používa).
  function MemStorage(seed) { Object.entries(seed || {}).forEach(([k, v]) => { this[k] = String(v); }); }
  MemStorage.prototype = Object.create(Object.prototype, {
    getItem: { value(k) { return Object.prototype.hasOwnProperty.call(this, String(k)) ? this[String(k)] : null; } },
    setItem: { value(k, v) { this[String(k)] = String(v); } },
    removeItem: { value(k) { delete this[String(k)]; } },
    clear: { value() { Object.keys(this).forEach(k => delete this[k]); } },
    key: { value(i) { return Object.keys(this)[i] ?? null; } },
    length: { get() { return Object.keys(this).length; } }
  });
  const dump = storage => Object.keys(storage).sort().reduce((o, k) => (o[k] = storage.getItem(k), o), {});

  // ——— Poistka skutočných údajov ———
  function realSnapshot() {
    const pick = store => { const o = {}; try { for (let i = 0; i < store.length; i++) { const k = store.key(i); if (k && k.startsWith(PREFIX)) o[k] = store.getItem(k); } } catch (_) { /* nič */ } return o; };
    return { local: pick(localStorage), session: pick(sessionStorage) };
  }
  function restoreReal(snap) {
    [[localStorage, snap.local], [sessionStorage, snap.session]].forEach(([store, saved]) => {
      const now = []; for (let i = 0; i < store.length; i++) { const k = store.key(i); if (k && k.startsWith(PREFIX)) now.push(k); }
      now.forEach(k => { if (!(k in saved)) store.removeItem(k); });
      Object.entries(saved).forEach(([k, v]) => { if (store.getItem(k) !== v) store.setItem(k, v); });
    });
  }
  // Master 2.8: snímky z realSnapshot() sú obyčajné objekty (nie Storage) – porovnať zoradené kľúče.
  const sortObj = o => Object.keys(o || {}).sort().reduce((r, k) => (r[k] = o[k], r), {});
  const sameSnap = (a, b) => JSON.stringify([sortObj(a.local), sortObj(a.session)]) === JSON.stringify([sortObj(b.local), sortObj(b.session)]);

  // ——— Spustenie appky v izolovanom rámci ———
  let appHtmlCache = null;
  async function appHtml() {
    if (appHtmlCache) return appHtmlCache;
    const res = await fetch("app.html?t=" + Date.now(), { cache: "no-store" });
    assert(res.ok, "app.html sa nenačítal (" + res.status + ")");
    appHtmlCache = await res.text();
    return appHtmlCache;
  }
  const GUARD = "<script>(function(){var t=window.__g2t;" +
    // Ak náhrada úložiska nie je na mieste, zvyšok stránky sa zmení na text a appka sa NESPUSTÍ (nedotkne sa skutočných údajov).
    "if(!t||!t.mediaDb||window.localStorage!==t.storage||window.sessionStorage!==t.session){document.write('<plaintext>');return;}" +
    "addEventListener('error',function(e){t.report('chyba',(e.message||'')+' @ '+String(e.filename||'').split('/').pop()+':'+e.lineno);});" +
    "addEventListener('unhandledrejection',function(e){t.report('promise',String(e.reason&&e.reason.message||e.reason));});" +
    "var ce=console.error;console.error=function(){t.report('console.error',[].map.call(arguments,String).join(' '));return ce.apply(console,arguments);};" +
    "HTMLMediaElement.prototype.play=function(){return Promise.resolve();};" +
    "window.confirm=function(){return true;};window.alert=function(){};window.open=function(){return null;};" +
    "})();<\/script>";
  async function bootApp(seed, opts = {}) {
    const html = await appHtml();
    const frame = document.createElement("iframe");
    frame.style.width = (opts.width || 390) + "px";
    frame.style.height = (opts.height || 844) + "px";
    frame.title = "Guguboo – testovací rámec";
    frame.src = "test.html?ramec=1";
    (opts.host || document.getElementById("g2tHost")).appendChild(frame);
    await new Promise(resolve => { frame.onload = resolve; });
    const win = frame.contentWindow, doc = frame.contentDocument;
    const storage = new MemStorage(seed), session = new MemStorage();
    const errors = [];
    doc.open();
    try {
      Object.defineProperty(win, "localStorage", { value: storage, configurable: true });
      Object.defineProperty(win, "sessionStorage", { value: session, configurable: true });
    } catch (_) { /* overí sa nižšie */ }
    if (win.localStorage !== storage || win.sessionStorage !== session) {
      doc.close(); frame.remove();
      throw new Error("Izolované úložisko sa v tomto prehliadači nepodarilo nastaviť – appka sa NEspustila (skutočné údaje sú v bezpečí).");
    }
    // Master 2.9: fotky a nahrávky idú do vlastnej testovacej databázy (skutočná guguboo-m-media sa nedotkne).
    // opts.mediaDb = tá istá databáza pre ďalšie spustenie; opts.noIdb = prehliadač bez IndexedDB.
    const mediaDb = opts.mediaDb || newTestDb();
    if (opts.noIdb) { try { Object.defineProperty(win, "indexedDB", { value: undefined, configurable: true }); } catch (_) { /* nič */ } }
    win.__g2t = { storage, session, mediaDb, report: (kind, msg) => errors.push(kind + ": " + msg) };
    doc.write(html.replace(/<head[^>]*>/i, m => m + GUARD));
    doc.close();
    const start = Date.now();
    // Stačí dokončené parsovanie (obrázky a zvuk sa môžu načítavať ďalej).
    while (!(doc.readyState !== "loading" && win.GugubooV5 && win.G2Backup)) {
      if (Date.now() - start > 30000) { frame.remove(); throw new Error("Appka sa do 30 s nenačítala (stav " + doc.readyState + "). " + errors.join(" | ")); }
      await sleep(100);
    }
    await sleep(opts.settle ?? 800);
    const remove = async (keepDb = !!opts.mediaDb) => {
      try { win.G2Media?.close(); } catch (_) { /* nič */ }
      frame.remove();
      if (!keepDb) await deleteDb(mediaDb);
    };
    return { frame, win, doc, storage, session, errors, mediaDb, state: () => win.eval("state"), remove };
  }

  // ——— Testovacie databázy fotiek (IndexedDB) ———
  const TEST_DB = PREFIX + "media-test-";
  let dbCounter = 0;
  const newTestDb = () => TEST_DB + Date.now().toString(36) + "-" + (++dbCounter);
  const deleteDb = name => new Promise(resolve => {
    if (!name || !name.startsWith(TEST_DB)) return resolve(); // poistka: nikdy nie skutočná databáza
    const request = indexedDB.deleteDatabase(name);
    request.onsuccess = request.onerror = () => resolve();
    request.onblocked = () => setTimeout(resolve, 500);
  });
  // Počet záznamov v skutočnej databáze guguboo-m-media (null = databáza neexistuje / nedá sa zistiť) – bez jej vytvorenia.
  async function realMediaCount() {
    if (!indexedDB.databases) return null;
    const list = await indexedDB.databases().catch(() => []);
    if (!list.some(d => d.name === PREFIX + "media")) return null;
    return new Promise(resolve => {
      const request = indexedDB.open(PREFIX + "media");
      request.onsuccess = () => {
        const db = request.result;
        try { const c = db.transaction("media").objectStore("media").count(); c.onsuccess = () => { db.close(); resolve(c.result); }; c.onerror = () => { db.close(); resolve(null); }; }
        catch (_) { db.close(); resolve(null); }
      };
      request.onerror = () => resolve(null);
    });
  }
  // Malé testovacie médiá (dataURL): 1×1 PNG a krátky „zvuk“.
  const PNG = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";
  const PNG2 = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==";
  const AUDIO = "data:audio/webm;codecs=opus;base64," + btoa("GUGUBOO-TEST-AUDIO-" + "x".repeat(200));
  function mediaSeed(extra = {}) {
    const base = seed("po", extra);
    const s = JSON.parse(base[PREFIX + "state"]);
    s.profile.photo = PNG;
    s.diary = [{ id: "d1", date: iso(addDays(-1)), text: "Bruško · 30. týždeň", photo: PNG2, bumpWeek: 30, created: new Date().toISOString() }];
    s.lullabies = [{ id: "l1", title: "Uspávanka", src: AUDIO, author: "mama", created: new Date().toISOString() }];
    s.v5.prenatalResults = [{ id: "r1", date: iso(addDays(-90)), type: "Ultrazvuk", text: "", photo: PNG, created: new Date().toISOString() }];
    s.v2 = { moments: { announced: iso(addDays(-120)), announcedImg: PNG2 } };
    base[PREFIX + "state"] = JSON.stringify(s);
    return base;
  }
  const bytesOf = async blob => Array.from(new Uint8Array(await blob.arrayBuffer()));
  const bytesOfDataUrl = url => Array.from(atob(url.slice(url.indexOf(",") + 1)), c => c.charCodeAt(0));

  function seed(kind, extra = {}) {
    const born = kind === "po";
    const s = {
      onboarded: kind !== "uvod",
      profile: {
        country: "SK", status: born ? "born" : "expecting", name: born ? "Tamarka" : "Bábätko",
        due: born ? iso(addDays(-55)) : iso(addDays(84)), birth: born ? iso(addDays(-60)) : ""
      },
      user: { name: "Testerka" },
      v5: { tourDone: true, night: !!extra.night }
    };
    if (kind === "uvod") { delete s.onboarded; s.profile = { country: "SK" }; }
    if (extra.v5) Object.assign(s.v5, extra.v5);
    if (extra.extra) Object.assign(s, extra.extra);
    const out = { [PREFIX + "state"]: JSON.stringify(s) };
    Object.assign(out, extra.keys || {});
    return out;
  }

  // ——— Viditeľný text (na kontrolu, že zvyšky starých verzií nevidno) ———
  function isVisible(el) {
    const win = el.ownerDocument.defaultView;
    for (let e = el; e && e.nodeType === 1; e = e.parentElement) {
      if (e.hidden) return false;
      const cs = win.getComputedStyle(e);
      if (cs.display === "none" || cs.visibility === "hidden" || cs.opacity === "0") return false;
    }
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }
  function visibleMatches(doc, re) {
    const out = [];
    const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const node = walker.currentNode;
      if (re.test(node.nodeValue) && node.parentElement && !/^(SCRIPT|STYLE|TEMPLATE)$/.test(node.parentElement.tagName) && isVisible(node.parentElement)) out.push(node.nodeValue.trim().slice(0, 70));
    }
    doc.querySelectorAll("[aria-label],[title]").forEach(el => {
      const text = (el.getAttribute("aria-label") || "") + " " + (el.getAttribute("title") || "");
      if (re.test(text) && isVisible(el)) out.push("[popis] " + text.trim().slice(0, 70));
    });
    // Pseudo-prvky (napr. starý štítok .nav button[data-tier]::after).
    doc.querySelectorAll("[data-tier]").forEach(el => {
      ["::before", "::after"].forEach(p => { const c = doc.defaultView.getComputedStyle(el, p).content; if (c && re.test(c) && isVisible(el)) out.push("[" + p + "] " + c); });
    });
    return out;
  }
  const LEFTOVERS = /premium|prémiov|spustíme čoskoro|od 4,99/i;

  // ——— Testy ———
  const J = () => window.GugubooJourney;
  const FIXED_NOW = new Date(2026, 10, 16, 10, 0, 0); // 16. 11. 2026 10:00 (miestny čas)
  const dueIn = (days, now = FIXED_NOW) => iso(addDays(days, now));

  const SUITES = [
    {
      name: "Verzie a súbory",
      tests: {
        "Verzia appky a cache service workera sedia (Master X.Y ↔ guguboo-m-app-X.Y)": async () => {
          const html = await appHtml();
          const ver = /GUGUBOO_V2_VERSION\s*=\s*"Master (\d+\.\d+)/.exec(html)?.[1];
          const sw = await (await fetch("sw.js?t=" + Date.now(), { cache: "no-store" })).text();
          const cache = /CACHE\s*=\s*"guguboo-m-app-([\d.]+)"/.exec(sw)?.[1];
          assert(ver && cache, "verziu alebo CACHE sa nepodarilo prečítať");
          eq(cache, ver, "sw.js CACHE");
        },
        "Všetky skripty a štýly z app.html sa dajú stiahnuť": async () => {
          const html = await appHtml();
          const urls = [...html.matchAll(/<(?:script[^>]+src|link[^>]+rel="stylesheet"[^>]+href)="([^"]+)"/g)].map(m => m[1]).filter(u => !/^https?:/.test(u));
          assert(urls.length > 10, "málo súborov – zmenil sa formát app.html?");
          const bad = [];
          await Promise.all(urls.map(async u => { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) bad.push(u + " (" + r.status + ")"); }));
          eq(bad, [], "nedostupné súbory");
        }
      }
    },
    {
      name: "Týždeň tehotenstva (journey-engine.js – jeden výpočet pre celú appku)",
      tests: {
        "Termín dnes = 40. týždeň": () => eq(J().pregnancyWeek(dueIn(0), FIXED_NOW), 40),
        "Termín o 1, 6 dní = 40. týždeň; o 8 dní = 39.": () => eq([1, 6, 8].map(d => J().pregnancyWeek(dueIn(d), FIXED_NOW)), [40, 40, 39]),
        "Termín o 140 dní (20 týždňov) = 20. týždeň": () => eq(J().pregnancyWeek(dueIn(140), FIXED_NOW), 20),
        "Termín o 141 dní = 20. týždeň; o 146 dní = 20.; o 147 = 19.": () => eq([141, 146, 147].map(d => J().pregnancyWeek(dueIn(d), FIXED_NOW)), [20, 20, 19]),
        "Začiatok: termín o 273 dní = 1. týždeň, o 280 a viac dní ostáva 1 (spodná hranica)": () => eq([273, 280, 300].map(d => J().pregnancyWeek(dueIn(d), FIXED_NOW)), [1, 1, 1]),
        "Po termíne: 1 deň = 41., 14 dní = 42., 60 dní ostáva 42 (horná hranica)": () => eq([-1, -14, -60].map(d => J().pregnancyWeek(dueIn(d), FIXED_NOW)), [41, 42, 42]),
        "Prázdny alebo chybný termín = žiadny týždeň (null)": () => eq(["", null, "abc", "2026-13"].map(v => J().pregnancyWeek(v, FIXED_NOW)), [null, null, null, null]),
        "Na hodine dňa nezáleží (00:05 aj 23:55 = ten istý týždeň)": () => {
          const due = "2027-01-04";
          eq(J().pregnancyWeek(due, new Date(2026, 10, 16, 0, 5)), J().pregnancyWeek(due, new Date(2026, 10, 16, 23, 55)));
        },
        "Prechod na letný/zimný čas nemení počet dní": () => {
          eq(J().dueDays("2027-04-10", new Date(2027, 2, 27, 23, 30)), 14, "marec 2027");
          eq(J().dueDays("2026-11-07", new Date(2026, 9, 24, 23, 30)), 14, "október 2026");
        },
        "Fáza podľa veku bábätka (popoludní): 0–42 dní po pôrode, do 365 dní prvý rok, potom ďalej": () => {
          const afternoon = new Date(2026, 10, 16, 15, 0, 0);
          const stage = days => J().context({ profile: { status: "born", birth: iso(addDays(-days, afternoon)) } }, afternoon).life_stage;
          eq([0, 42, 43, 365, 366].map(stage), ["postpartum", "postpartum", "baby", "baby", "parenthood"]);
        },
        "Nález na rozhodnutie: vek bábätka v dňoch závisí od hodiny (pred poludním o deň menej)": () => {
          // context() počíta vek od dátumu narodenia o 12:00 (toDate) a zaokrúhľuje nadol; týždeň tehotenstva je kalendárny (bez hodín).
          const birth = iso(addDays(-42, FIXED_NOW));
          const at = h => J().context({ profile: { status: "born", birth } }, new Date(2026, 10, 16, h, 0, 0)).baby_age_days;
          if (at(10) !== at(14)) known("narodenie pred 42 dňami: o 10:00 = " + at(10) + " dní, o 14:00 = " + at(14) + " dní (fáza sa mení o poludní, nie o polnoci).");
        },
        "Bez termínu aj narodenia = nastavenie (setup)": () => eq(J().context({ profile: {} }, FIXED_NOW).life_stage, "setup"),

  // ——— Master 4.0 (Audit V1, V2, V3, F1): kontrast textu k skutočnému pozadiu ———
  // Pozadie = vrstvy predkov (farba aj zastávky prechodu) až po prvú nepriehľadnú; text so svojou priehľadnosťou a priehľadnosťou
  // predkov. Najhorší pomer zo všetkých zastávok prechodu. Neaktívne ovládanie (disabled) a text len pre čítačky sa nemerajú (WCAG).
  const rgbaOf = c => { const m = String(c).match(/rgba?\(([^)]+)\)/); if (!m) return null; const p = m[1].split(/[ ,\/]+/).filter(Boolean).map(Number); return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 }; };

  function backgroundsOf(win, el) {
    const layers = [];

      if (grads.length && grads.some(g => g.a > .5)) { layers.push({ grads, col }); if (grads.every(g => g.a >= .99)) break; }
      else if (col && col.a > 0) { layers.push({ col }); if (col.a >= .99) break; }
    }
    let bases = [win.document.body.classList.contains("night") ? { r: 16, g: 20, b: 33, a: 1 } : { r: 251, g: 248, b: 247, a: 1 }];
    for (let i = layers.length - 1; i >= 0; i--) {
      const L = layers[i], next = [];
      bases.forEach(b => { const bb = L.col && L.col.a > 0 && L.grads ? over(L.col, b) : b; if (L.grads) L.grads.forEach(g => next.push(over(g, bb))); else next.push(over(L.col, b)); });

  }
  function contrastIssues(app, root) {
    const { win, doc } = app, out = [], seen = new Set();
    const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const el = walker.currentNode.parentElement, text = walker.currentNode.nodeValue.trim();
      if (!text || !el || seen.has(el) || /^(SCRIPT|STYLE|OPTION|TEMPLATE)$/.test(el.tagName) || !/[\p{L}\p{N}]/u.test(text) || el instanceof win.SVGElement) continue;

  // Master 3.6: viditeľné texty na obrazovke → kombinácie (veľkosť/hrúbka/kapitálky). Text v SVG (kruh) sa meria
  // v skutočnej veľkosti na obrazovke (font-size × zmenšenie SVG). Šípky „›“ a „×“ sa zatiaľ počítajú tiež.
  // Master 3.7: root = len obsah okna (bez domova pod ním); bez znakov bez písmen/číslic (›, ×, ＋, emoji) a bez čísel časovača.
  function typeStats(app, root) {
    const { win, doc } = app;
    const combos = new Map(), small = [], ringSmall = [], weights = new Set();
    const inView = el => { const r = el.getBoundingClientRect(); return r.width > 1 && r.height > 1 && r.bottom > 0 && r.top < win.innerHeight && r.right > 0 && r.left < win.innerWidth; };
    const walker = doc.createTreeWalker(root || doc.body, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const node = walker.currentNode, el = node.parentElement, text = node.nodeValue.trim();
      if (!text || !el || /^(SCRIPT|STYLE|TEMPLATE|NOSCRIPT|OPTION)$/.test(el.tagName) || !isVisible(el) || !inView(el)) continue;
      if (!/[\p{L}\p{N}]/u.test(text) || el.closest(".g2q-time, .g2r-timer, .v5-timer-pill")) continue;
      const cs = win.getComputedStyle(el);
      let size = parseFloat(cs.fontSize);
      if (el instanceof win.SVGElement && el.getScreenCTM) { const m = el.getScreenCTM(); if (m) size *= Math.hypot(m.a, m.b); }
      size = Math.round(size * 10) / 10;

      if (!combos.has(key)) combos.set(key, text.slice(0, 30));
      weights.add(cs.fontWeight);

      if (size < 12.95) small.push(size + " px „" + text.slice(0, 30) + "“");
    }

  }
  function typeCheck(app, where, max = 4, root = null) {
    const s = typeStats(app, root);

    assert(s.combos.size <= max, where + ": " + s.combos.size + " kombinácií (max. " + max + "): " + list);
    eq(s.small, [], where + ": text pod 13 px");

  // ≤ max kombinácií (veľkosť + hrúbka; ikony a znaky bez písmen/číslic sa nerátajú), nič pod 13 px, hrúbky 500/700/800,
  // žiadne kapitálky ani letter-spacing > 0,02 em a žiadny text väčší ako nadpis okna – okrem bežiaceho času (.g2q-time, .g2r-timer).

        if (!/[\p{L}\p{N}]/u.test(text) || el.closest(".g2q-time, .g2r-timer, .v5-timer-pill")) continue;

  const CTRL_SYMBOLS = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{2712}\u{2714}-\u{27BF}\u{2B00}-\u{2BFF}◌⇡↟⏱≈️]/u;

      sec.innerHTML = "<h2>" + esc(suite.name) + "</h2>";
      out.appendChild(sec);
      for (const [name, fn] of Object.entries(suite.tests)) {
        const row = document.createElement("div");
        row.className = "t"; row.textContent = name + " …";
        sec.appendChild(row);
        try { await fn(); row.className = "t ok"; row.innerHTML = esc(name); pass++; }
        catch (e) {
          const isKnown = e instanceof Known;
          row.className = "t " + (isKnown ? "nalez" : "chyba"); row.innerHTML = esc(name) + "<small>" + esc(e.message) + "</small>";
          if (isKnown) found++; else fail++;
        }
      }
    }
    // Poistka: skutočné údaje guguboo-m-* musia byť rovnaké ako pred testami.
    const sec = document.createElement("section");
    sec.innerHTML = "<h2>Poistka skutočných údajov</h2>";
    const row = document.createElement("div");
    const after = realSnapshot();
    if (sameSnap(before, after)) { row.className = "t ok"; row.textContent = "Skutočné údaje guguboo-m-* sa nezmenili (" + Object.keys(before.local).length + " kľúčov)."; pass++; }
    else { restoreReal(before); row.className = "t chyba"; row.innerHTML = "Skutočné údaje sa počas testov zmenili – pôvodný stav je obnovený.<small>Ak bola appka otvorená v inej karte, zatvor ju a spusti testy znova.</small>"; fail++; }
    sec.appendChild(row);
    const mediaAfter = await realMediaCount();
    const mrow = document.createElement("div");
    if (mediaBefore === mediaAfter) { mrow.className = "t ok"; mrow.textContent = mediaBefore === null ? "Skutočná databáza fotiek guguboo-m-media v tomto prehliadači nie je (testy ju nevytvorili)." : "Skutočná databáza fotiek sa nezmenila (" + mediaBefore + " záznamov)."; pass++; }
    else { mrow.className = "t chyba"; mrow.innerHTML = "Počet záznamov v skutočnej databáze fotiek sa zmenil (" + mediaBefore + " → " + mediaAfter + ").<small>Ak bola appka otvorená v inej karte, zatvor ju a spusti testy znova.</small>"; fail++; }
    sec.appendChild(mrow);
    out.appendChild(sec);
    const sum = document.getElementById("g2tSum");
    sum.className = "sum " + (fail ? "chyba" : "ok");
    sum.textContent = fail ? fail + " červených · " + pass + " zelených" + (found ? " · " + found + " nález" : "") : "Všetko zelené (" + pass + ")" + (found ? " · " + found + " známy nález na rozhodnutie" : "");
    document.title = (fail ? "CHYBA" : "OK") + " – Guguboo testy";
    document.body.dataset.vysledok = fail ? "chyba" : "ok";
    document.body.dataset.zhrnutie = sum.textContent;
    window.__g2TestResult = { done: true, pass, fail, known: found, failures: [...document.querySelectorAll(".t.chyba")].map(el => el.innerText) };
  }

  // Náhľad bez skutočných údajov: test.html?nahlad=pred|po|uvod&noc=1
  async function preview(kind) {
    document.body.className = "nahlad";
    const host = document.createElement("div");
    document.body.appendChild(host);
    // Master 2.9: nahlad=foto = po pôrode s testovacími fotkami a nahrávkou (fotky idú do testovacej databázy).
    const data = kind === "foto" ? mediaSeed({ night: params.get("noc") === "1" }) : seed(kind, { night: params.get("noc") === "1" });
    const app = await bootApp(data, { host, width: +params.get("w") || window.innerWidth, height: +params.get("h") || window.innerHeight, settle: 300 });
    window.__g2Preview = app;
    document.body.dataset.chyby = String(app.errors.length);
    document.body.dataset.zhrnutie = app.errors.join(" | ");
    if (app.errors.length) console.warn("Guguboo náhľad – chyby:", app.errors);
  }

  if (params.get("nahlad")) preview(params.get("nahlad")).catch(e => { document.body.textContent = e.message; });
  else run().catch(e => { document.body.dataset.vysledok = "chyba"; document.body.insertAdjacentText("beforeend", "Testy spadli: " + e.message); });
})();
</script>
</body>

<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototyp – kvet prípravy na domove</title>
<link href="fonts/montserrat.css?v=m2.9" rel="stylesheet">
<!-- Prototyp (Samo 16. 11.): stred kruhu „zaktívniť“ – kvet prípravy namiesto kruhu na domove.
     Lupene = kategórie Plánu (nahrádzajú vizualizáciu Plánu, nie sú ďalší zoznam). Farbia sa samy plynutím
     času a odškrtnutie úloh ich len dofarbí – nikdy prázdne miesto, čísla, percentá ani výčitka.
     Stred: ťuk alebo podržanie otvorí rýchle akcie (podržanie = zoom efekt + vibrácia).
     Po pôrode: dnešný kruh rýchlych záznamov (predvolené) a kvet „prvé týždne“ ako variant na porovnanie.
     Nie je súčasťou appky. Stav len v pamäti stránky, nič sa neukladá. Ikony = cesty z iconPaths (Phosphor, MIT). -->
<style>
:root {
  --bg: #fbf8f7; --surface: #fff; --soft: #f3effd; --ink: #29243a; --muted: #5d5768; --line: #e6dff0;
  --brand: #7b6bc8; --brand-ink: #5f4fb1; --icon: #6a4fc4; --pink-ink: #b34f6c;
  --card-line: rgba(117, 96, 181, .14); --shadow: 0 6px 20px rgba(60, 40, 90, .07);
  --center: linear-gradient(145deg, #f8f4ff, #fff1ec); --center-line: rgba(117, 96, 181, .22);
  --petal-line: rgba(95, 79, 177, .30); --petal-ink: #3a3070; --petal-tint: .26;
  --dim: rgba(41, 36, 58, .32); --proto: #ece6f7; --proto-ink: #29243a;
  --f: Montserrat, "Segoe UI", system-ui, sans-serif;
}
body.night {
  --bg: #141826; --surface: #212638; --soft: #2a2f42; --ink: #f5f2fb; --muted: #c9c3d8; --line: #343a50;
  --brand: #a597ea; --brand-ink: #c6bcff; --icon: #c6bcff; --pink-ink: #f3a9bd;
  --card-line: rgba(198, 188, 255, .14); --shadow: 0 6px 20px rgba(0, 0, 0, .3);
  --center: linear-gradient(145deg, #353b54, #2a2f42); --center-line: rgba(198, 188, 255, .25);
  --petal-line: rgba(230, 224, 255, .26); --petal-ink: #f5f2fb; --petal-tint: .30;
  --dim: rgba(6, 8, 16, .55); --proto: #0c0f1a; --proto-ink: #f5f2fb;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 600 16px/1.45 var(--f); max-width: 450px; margin: 0 auto; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; transition: background .3s, color .3s; -webkit-tap-highlight-color: transparent; }
body:not(.night) { background-image: radial-gradient(circle at 8% 0%, rgba(224, 214, 255, .58), transparent 32%), radial-gradient(circle at 96% 8%, rgba(255, 220, 220, .52), transparent 30%); }
button { font-family: var(--f); color: inherit; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
svg.i { width: 24px; height: 24px; fill: currentColor; flex: 0 0 auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* —— ovládanie prototypu (nie je súčasť appky) —— */
.proto { flex: 0 0 auto; display: flex; gap: 4px; align-items: center; padding: 4px 6px; background: var(--proto); color: var(--proto-ink); border-bottom: 1px dashed #b9add9; }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: 14px; background: rgba(255,255,255,.55); }
body.night .seg { background: rgba(255,255,255,.08); }
.pp { min-height: 44px; min-width: 44px; padding: 0 9px; border: 0; border-radius: 12px; background: transparent; font: 700 14px/1.1 var(--f); color: var(--proto-ink); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.pp[aria-pressed="true"] { background: #5f4fb1; color: #fff; }
.pp svg { width: 18px; height: 18px; }
.proto .grow { flex: 1; }

/* —— domov (zjednodušená kópia appky) —— */
.screen { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 10px; }
.hdr { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
.hello { flex: 1; min-width: 0; padding: 6px 14px; border-radius: 22px; background: var(--surface); border: 1px solid var(--card-line); }
.hello b { display: block; font-size: 18px; font-weight: 800; line-height: 1.2; }
.hello span { display: block; font-size: 14px; color: var(--muted); line-height: 1.3; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--card-line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: 0 0 auto; }
.iconbtn svg { width: 22px; height: 22px; }
.search { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border: 1px solid var(--card-line); border-radius: 18px; background: var(--surface); color: var(--muted); font: 600 16px/1 var(--f); text-align: left; cursor: pointer; width: 100%; }
.search svg { width: 20px; height: 20px; }
.hero { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 6px 14px; border: 1px solid var(--card-line); border-radius: 22px; background: linear-gradient(120deg, #f4f0ff, #fff4f0); text-align: left; width: 100%; cursor: pointer; }
body.night .hero { background: linear-gradient(120deg, #2a2f42, #33293a); }
.hero .av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; background: #fff3d6; color: var(--icon); }
body.night .hero .av { background: #3b3a4c; }
.hero b { display: block; font-size: 18px; font-weight: 800; line-height: 1.2; }
.hero span { display: block; font-size: 14px; color: var(--muted); }
.hero .chev { margin-left: auto; color: var(--muted); font-size: 22px; font-weight: 800; }
.tiles { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { min-height: 64px; padding: 6px 4px; border: 1px solid var(--card-line); border-radius: 22px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 800 14px/1.15 var(--f); cursor: pointer; }
.tile .ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: rgba(123, 97, 200, .12); color: var(--icon); }
.tile .ic svg { width: 18px; height: 18px; }

/* —— karta kvetu —— */
.fcard { position: relative; flex: 1 1 auto; min-height: 0; border: 1px solid var(--card-line); border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); container-type: size; display: grid; place-items: center; transition: box-shadow .3s; }
.fcard.raised { z-index: 31; }
.stage { position: relative; width: min(100cqw - 20px, 100cqh - 14px, 330px); transition: width .4s, transform .45s cubic-bezier(.2, .8, .2, 1); aspect-ratio: 1; container-type: inline-size; }
.fcard.has-hint { place-items: start center; padding-top: 6px; }
.fcard.has-hint .stage { width: min(100cqw - 20px, 100cqh - 52px, 330px); }
.stage svg.fl { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.stage.zoom { transform: scale(1.07); }
.stage.zoom .petal, .stage.zoom .seg-r, .stage.zoom .rlab { opacity: .22; transition: opacity .35s; }

/* lupene */
.petal { cursor: pointer; outline: none; transition: opacity .35s; }
.petal .inner { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
.petal:hover .inner, .petal.hl .inner { transform: scale(1.045); }
.petal .p-bg { fill: var(--c); fill-opacity: var(--petal-tint); }
/* farba rozkvitá od stredu kvetu von – sústredné, mäkké okraje (žiadna „ručička“ ani percentá) */
.petal .p-fill { transform-box: fill-box; transform-origin: 50% 50%; transform: scale(calc((56 + var(--f, .16) * 102) / 158)); transition: transform 1.6s cubic-bezier(.3, .7, .2, 1); }
.petal .p-line { fill: none; stroke: var(--petal-line); stroke-width: 1.5; transition: stroke .3s, stroke-width .3s; }
.petal .p-glow { fill: var(--c); opacity: 0; filter: blur(7px); }
.petal.now .p-glow { opacity: .85; animation: breathe 3.4s ease-in-out infinite; }
.petal.now .p-line, .petal.hl .p-line { stroke: var(--brand); stroke-width: 2.5; }
.petal:focus-visible .p-line { stroke: var(--brand-ink); stroke-width: 4; }
.petal .p-ic { fill: var(--petal-ink); pointer-events: none; }
.petal.done .p-ic { fill: var(--petal-ink); }
.petal.pop .inner { animation: pop 1s ease-out; }
@keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: .95; } }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.09); } 100% { transform: scale(1); } }

/* kruh po pôrode (dnešný) */
.seg-r { cursor: pointer; stroke: var(--surface); stroke-width: 7; stroke-linejoin: round; transition: opacity .35s, filter .15s; outline: none; }
.seg-r:hover { filter: brightness(1.04); }
.seg-r:focus-visible { stroke: var(--brand-ink); stroke-width: 4; }
.rlab { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; color: #29243a; font: 800 clamp(14px, 4.9cqw, 16px)/1.15 var(--f); text-align: center; white-space: nowrap; transition: opacity .35s; }
.rlab small { font: 600 clamp(12px, 3.9cqw, 13px)/1.2 var(--f); }
.rlab svg { width: clamp(18px, 6.6cqw, 22px); height: clamp(18px, 6.6cqw, 22px); }

/* stred */
.center { position: absolute; left: 50%; top: 50%; width: 33%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 1.5px solid var(--center-line); background: var(--center); box-shadow: 0 6px 18px rgba(80, 60, 140, .14); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0; cursor: pointer; color: var(--ink);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s; z-index: 2; }
.center:active { transform: translate(-50%, -50%) scale(.97); }
.center .n { font: 800 clamp(22px, 9cqw, 30px)/1 var(--f); }
.center .w { font: 700 clamp(14px, 4.4cqw, 15px)/1.2 var(--f); color: var(--muted); }
.center .t { font: 800 clamp(20px, 7.4cqw, 26px)/1.05 var(--f); font-variant-numeric: tabular-nums; }
.center svg { width: 20px; height: 20px; color: var(--icon); }
.center.open { box-shadow: 0 0 0 6px rgba(123, 107, 200, .16), 0 10px 26px rgba(80, 60, 140, .22); }
.holdring { position: absolute; left: 50%; top: 50%; width: 39%; aspect-ratio: 1; transform: translate(-50%, -50%) rotate(-90deg); pointer-events: none; z-index: 1; overflow: visible; }
.holdring circle { fill: none; stroke: var(--brand); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; }
.holding .holdring circle { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset .42s linear, opacity .1s; }
.hintpulse .holdring circle { stroke-dasharray: none; stroke-dashoffset: 0; stroke-width: 2; animation: hint 2.6s ease-out infinite; transform-origin: 50% 50%; transform-box: fill-box; }
@keyframes hint { 0% { opacity: .7; transform: scale(.9); } 70%, 100% { opacity: 0; transform: scale(1.18); } }
.pill { position: absolute; left: 50%; top: calc(50% + 11%); transform: translateX(-50%); z-index: 3; min-height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: #5f4fb1; color: #fff; font: 800 13px/1 var(--f); cursor: pointer; white-space: nowrap; }
.pill::after { content: ""; position: absolute; inset: -6px -4px; } /* ťukacia plocha ≥ 44 px */

/* náznak podržania – len pri prvom použití */
.hint { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--soft); color: var(--brand-ink); font: 700 14px/1.2 var(--f); white-space: nowrap; pointer-events: none; transition: opacity .4s; z-index: 4; }
.hint svg { width: 18px; height: 18px; }

/* —— Dnes stačí jedno —— */
.today { flex: 0 0 auto; display: flex; align-items: stretch; min-height: 58px; border: 1px solid var(--card-line); border-radius: 22px; background: var(--surface); overflow: hidden; }
.today .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 4px 6px 14px; border: 0; background: transparent; text-align: left; cursor: pointer; }
.today .mini { width: 26px; height: 30px; flex: 0 0 auto; }
.today small { display: block; font: 700 13px/1.2 var(--f); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.today b { display: block; font: 800 15px/1.25 var(--f); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.today .later { flex: 0 0 auto; min-width: 72px; border: 0; background: transparent; color: var(--brand-ink); font: 800 14px/1 var(--f); cursor: pointer; padding: 0 14px; }

/* —— lišta —— */
.tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--card-line); border-radius: 22px 22px 0 0; }
.tab { min-height: 48px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 700 13px/1 var(--f); color: var(--muted); cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--brand-ink); }

/* —— rozkvet rýchlych akcií —— */
.dim { position: fixed; inset: 0; z-index: 30; background: var(--dim); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); opacity: 0; transition: opacity .3s; }
.dim.show { opacity: 1; }
.bloom { position: fixed; inset: 0; z-index: 32; pointer-events: none; }
.bub { position: absolute; width: 96px; margin-left: -48px; margin-top: -30px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; cursor: pointer; pointer-events: auto; color: var(--ink);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; transition: transform .42s cubic-bezier(.2, .9, .25, 1.18), opacity .25s; transition-delay: var(--d); }
.bloom.show .bub { transform: translate(0, 0) scale(1); opacity: 1; }
.bub .c { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--icon); box-shadow: 0 6px 18px rgba(40, 25, 80, .22); border: 2px solid var(--bc, transparent); transition: transform .15s, background .15s; }
.bub .c svg { width: 26px; height: 26px; }
.bub .l { padding: 3px 9px; border-radius: 999px; background: var(--surface); font: 800 14px/1.15 var(--f); white-space: nowrap; box-shadow: 0 2px 8px rgba(40, 25, 80, .14); }
.bub.over .c, .bub:hover .c { transform: scale(1.12); background: var(--soft); }
.bub:focus-visible { outline: none; }
.bub:focus-visible .c { outline: 3px solid var(--brand); outline-offset: 3px; }
.bub.live .c { --bc: #5f4fb1; }

/* —— okno oblasti —— */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(41, 36, 58, .30); opacity: 0; transition: opacity .25s; }
body.night .scrim { background: rgba(0, 0, 0, .5); }
.scrim.show { opacity: 1; }
.sheet { position: fixed; left: 50%; bottom: 0; z-index: 41; width: min(100%, 450px); max-height: 78dvh; overflow: auto; transform: translate(-50%, 100%); transition: transform .35s cubic-bezier(.2, .8, .2, 1); background: var(--surface); border-radius: 24px 24px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(40, 25, 80, .16); }
.sheet.show { transform: translate(-50%, 0); }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 8px; }
.sh-head { display: flex; align-items: center; gap: 12px; }
.sh-head svg.mp { width: 40px; height: 48px; flex: 0 0 auto; }
.sh-head h2 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; padding: 3px 10px; border-radius: 999px; background: var(--soft); color: var(--brand-ink); font: 700 13px/1.2 var(--f); }
.sh-lead { margin: 10px 0 6px; color: var(--muted); font-size: 15px; line-height: 1.45; }
.tasks { list-style: none; margin: 0; padding: 0; }
.task { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 6px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; font: 600 16px/1.3 var(--f); cursor: pointer; }
.tasks li:last-child .task { border-bottom: 0; }
.box { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--brand); display: grid; place-items: center; flex: 0 0 auto; transition: background .25s, border-color .25s; }
.box svg { width: 18px; height: 18px; color: #fff; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .3s cubic-bezier(.2, .9, .25, 1.3); }
.task[aria-checked="true"] .box { background: #5f4fb1; border-color: #5f4fb1; }
.task[aria-checked="true"] .box svg { opacity: 1; transform: scale(1); }
.task[aria-checked="true"] .tx { color: var(--muted); }
.sh-foot { display: flex; gap: 8px; margin-top: 12px; }
.btn { flex: 1; min-height: 48px; border-radius: 16px; border: 1px solid var(--card-line); background: var(--soft); color: var(--brand-ink); font: 800 15px/1.1 var(--f); cursor: pointer; }

/* —— hlásenie —— */
.toast { position: fixed; left: 50%; bottom: 84px; z-index: 50; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; width: max-content; max-width: min(92vw, 410px); display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 18px; background: #29243a; color: #fff; font: 600 15px/1.35 var(--f); box-shadow: 0 8px 24px rgba(0, 0, 0, .2); transition: opacity .25s, transform .3s; }
body.night .toast { background: #f5f2fb; color: #29243a; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { min-height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: rgba(255,255,255,.14); color: inherit; font: 800 14px/1 var(--f); cursor: pointer; }
body.night .toast button { background: rgba(41,36,58,.1); }

/* nízka obrazovka (375 × 667) – kvet dostane viac miesta */
@media (max-height: 720px) {
  .screen { gap: 8px; padding-top: 6px; }
  .hello { padding: 4px 12px; } .hello span { display: none; }
  .search { min-height: 44px; }
  .hero { min-height: 48px; padding: 2px 12px; } .hero .av { width: 36px; height: 36px; }
  .hero span span { display: none; }
  .tile { min-height: 44px; flex-direction: row; gap: 6px; border-radius: 18px; }
  .tile .ic { width: 26px; height: 26px; }
  .today { min-height: 48px; }
  .tab { min-height: 44px; }
  .tabs { padding-top: 2px; padding-bottom: 2px; }
  .bub .c { width: 54px; height: 54px; }
  .fcard.has-hint .stage { width: min(100cqw - 20px, 100cqh - 44px, 330px); }
  /* ovládanie prototypu sa na nízkej obrazovke schová do plávajúceho tlačidla, aby merala skutočná appka */
  .proto { position: fixed; top: 6px; right: 8px; z-index: 60; flex-wrap: wrap; justify-content: flex-end; max-width: 300px; border: 1px dashed #b9add9; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .proto:not(.open) > :not(#protoBtn) { display: none !important; }
  .proto:not(.open) { padding: 0; background: transparent; border: 0; box-shadow: none; }
  #protoBtn { display: inline-flex !important; background: var(--proto); border: 1px dashed #b9add9; }
}
#protoBtn { display: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .petal.now .p-glow { opacity: .7; }
}
</style>
</head>
<body>
<div class="proto" id="proto" role="group" aria-label="Ovládanie prototypu">
  <button class="pp" id="protoBtn" aria-expanded="false" aria-label="Ovládanie prototypu">Proto</button>
  <div class="seg" role="group" aria-label="Obdobie">
    <button class="pp" id="pPred" aria-pressed="true" aria-label="Pred pôrodom">Pred</button>
    <button class="pp" id="pPo" aria-pressed="false" aria-label="Po pôrode">Po</button>
  </div>
  <div class="seg" id="variantSeg" role="group" aria-label="Variant po pôrode" hidden>
    <button class="pp" id="vRing" aria-pressed="true" aria-label="Dnešný kruh záznamov">Kruh</button>
    <button class="pp" id="vFlower" aria-pressed="false" aria-label="Kvet prvých týždňov">Kvet</button>
  </div>
  <button class="pp" id="pWeek" aria-label="Zmeniť týždeň">15. t.</button>
  <span class="grow"></span>
  <button class="pp" id="pNight" aria-pressed="false" aria-label="Nočný režim"></button>
  <button class="pp" id="pReset" aria-label="Začať odznova (ukáže aj náznak podržania)">↺</button>
</div>

<main class="screen" id="screen">
  <div class="hdr">
    <div class="hello"><b id="hello">Dobrý deň, Lucia</b><span id="helloSub">Pekný deň pred vami.</span></div>
    <button class="iconbtn" id="moonBtn" aria-label="Nočný režim"></button>
    <button class="iconbtn" data-toast="Otvorí ponuku" aria-label="Ponuka"></button>
  </div>

      c.style.paddingBottom = "16%";
    } else {
      c.innerHTML = icon("sun") + `<span class="w" style="color:var(--ink);font-weight:800">Náš deň</span>`;
      c.setAttribute("aria-label", "Náš deň – rýchle akcie");
      pill.hidden = true; c.style.paddingBottom = "";
    }
  }
  setInterval(() => { const t = $("tm"); if (t && state.timer) t.textContent = fmt(Date.now() - state.timer.start); }, 1000);
  function startTimer(kind) {
    if (state.timer && state.timer.kind === kind) return stopTimer();
    state.timer = { kind, start: Date.now() };
    renderCenter();
    toast(kind === "sleep" ? "Spánok beží – čas vidíš v strede" : "Kŕmenie beží – čas vidíš v strede");
  }
  function stopTimer() {
    const prev = state.timer; if (!prev) return;
    const min = Math.max(1, Math.round((Date.now() - prev.start) / 60000));
    state.timer = null; renderCenter();
    toast(`Uložené · ${prev.kind === "sleep" ? "spánok" : "kŕmenie"} ${min} min`, "Vrátiť", () => { state.timer = prev; renderCenter(); toast("Vrátené – čas beží ďalej"); });
  }

  // —— Dnes stačí jedno (ukazuje lupeň, ktorý je na rade) ——
  function renderToday() {
    const a = nowArea(), i = areas().indexOf(a), task = a.tasks.find(x => !x.d) || a.tasks[0];
    const col = COLORS[state.night ? "night" : "day"][i % 8];
    $("todayMain").innerHTML = `<svg class="mini" viewBox="-60 -160 120 108" aria-hidden="true"><path d="${petalPath(8)}" fill="${col}" stroke="var(--brand)" stroke-width="5"/></svg>
      <span style="min-width:0"><small>Dnes stačí jedno</small><b>${task.t}</b></span>`;
    $("todayMain").setAttribute("aria-label", `Dnes stačí jedno: ${task.t}. Lupeň ${a.name}`);
    $("todayMain").dataset.i = i;
  }
  const highlight = (i, on) => { const g = $("fl").querySelector(`.petal[data-i="${i}"]`); if (g) g.classList.toggle("hl", on); };
  ["pointerenter", "focus"].forEach(ev => $("todayMain").addEventListener(ev, () => showFlower() && highlight($("todayMain").dataset.i, true)));
  ["pointerleave", "blur"].forEach(ev => $("todayMain").addEventListener(ev, () => highlight($("todayMain").dataset.i, false)));
  $("todayMain").addEventListener("click", () => {
    const i = +$("todayMain").dataset.i;
    if (showFlower()) { highlight(i, true); setTimeout(() => { highlight(i, false); openSheet(i); }, 380); }
    else openSheet(i);
  });

  // —— hlavné vykreslenie ——
  function render() {
    document.body.classList.toggle("night", state.night);
    const pred = state.phase === "pred";
    $("pPred").setAttribute("aria-pressed", pred); $("pPo").setAttribute("aria-pressed", !pred);
    $("variantSeg").hidden = pred;
    $("vRing").setAttribute("aria-pressed", state.variant === "ring"); $("vFlower").setAttribute("aria-pressed", state.variant === "flower");
    $("pWeek").textContent = pred ? `${week()}. t.` : `${week()}. t. po`;
    $("pWeek").setAttribute("aria-label", pred ? `Týždeň tehotenstva ${week()}, zmeniť` : `${week()}. týždeň po pôrode, zmeniť`);
    $("pNight").innerHTML = icon(state.night ? "sun" : "moon"); $("pNight").setAttribute("aria-pressed", state.night);
    $("moonBtn").innerHTML = icon(state.night ? "sun" : "moon");
    document.querySelector("[aria-label='Ponuka']").innerHTML = icon("menu");
    $("hello").textContent = state.night ? "Dobrý večer, Lucia" : "Dobrý deň, Lucia";
    $("helloSub").textContent = pred ? (state.night ? "Deň sa pomaly končí." : "Pekný deň pred vami.") : `Dnes je to ${week() * 7}. deň spolu`;
    $("hero").innerHTML = pred
      ? `<span class="av">${icon("leaf")}</span><span><b>${week()}. týždeň</b><span>Tvoj týždeň – vývoj bábätka</span></span><span class="chev">›</span>`
      : `<span class="av">${icon("baby")}</span><span><b>Ema</b><span>${week() < 5 ? week() + ". týždeň" : Math.ceil(week() / 4.35) + ". mesiac"}</span></span><span class="chev">›</span>`;
    $("tiles").innerHTML = (pred
      ? [["leaf", "Čo je bežné"], ["mama", "Tvoje telo"], ["calendar", "Kalendár"]]
      : [["handPalm", "Starostlivosť"], ["sparkle", "Aktivity"], ["clipboard", "Zdrav. knižka"]])
      .map(([ic, l]) => `<button class="tile" data-toast="Otvorí ${l}"><span class="ic">${icon(ic)}</span>${l}</button>`).join("");
    $("stage").querySelectorAll(".rlab").forEach(e => e.remove());
    if (showFlower()) renderFlower(); else renderRing();
    $("fcard").setAttribute("aria-label", showFlower() ? "Kvet prípravy" : "Rýchle záznamy");
    renderCenter(); renderToday();
    $("hint").hidden = state.hintSeen;
    $("fcard").classList.toggle("has-hint", !state.hintSeen);
    $("stage").classList.toggle("hintpulse", !state.hintSeen);
  }

  // —— okno oblasti ——
  let lastFocus = null;
  const mpScale = a => ((56 + fillOf(a) * 102) / 158).toFixed(3);
  function openSheet(i) {
    const a = areas()[i], now = nowArea(), col = COLORS[state.night ? "night" : "day"][i % 8];
    state.sheet = i; lastFocus = document.activeElement;
    $("sheet").innerHTML = `<div class="grab"></div>
      <div class="sh-head">
        <svg class="mp" viewBox="-62 -160 124 108" aria-hidden="true" style="--c:${col}">
          <defs><clipPath id="mpc" clipPathUnits="userSpaceOnUse"><path d="${petalPath(8)}"/></clipPath></defs>
          <path d="${petalPath(8)}" fill="${col}" fill-opacity=".3"/>
          <g clip-path="url(#mpc)"><circle id="mpFill" cx="0" cy="0" r="158" fill="${col}" style="transform-box:fill-box;transform-origin:50% 50%;transform:scale(${mpScale(a)});transition:transform 1.2s cubic-bezier(.3,.7,.2,1)"/></g>
          <path d="${petalPath(8)}" fill="none" stroke="var(--brand)" stroke-width="4"/>
        </svg>
        <div style="flex:1;min-width:0"><h2 id="shTitle">${a.name}</h2>${a.id === now.id ? `<span class="chip">${icon("sparkle")}Teraz sa hodí</span>` : ""}</div>
        <button class="iconbtn" id="shClose" aria-label="Zavrieť">${icon("x")}</button>
      </div>
      <p class="sh-lead">${a.lead}</p>
      <ul class="tasks">${a.tasks.map((t, k) => `<li><button class="task" role="checkbox" aria-checked="${t.d}" data-k="${k}"><span class="box">${icon("check")}</span><span class="tx">${t.t}</span></button></li>`).join("")}</ul>
      <div class="sh-foot"><button class="btn" data-toast="Otvorí celý Plán – časť ${a.name}">Celý plán</button></div>`;
    $("sheet").querySelectorAll(".chip svg").forEach(s => { s.style.width = "14px"; s.style.height = "14px"; });
    $("scrim").hidden = false; $("sheet").hidden = false;
    void $("sheet").offsetWidth;
    $("scrim").classList.add("show"); $("sheet").classList.add("show");
    $("shClose").onclick = closeSheet;
    $("sheet").querySelectorAll(".task").forEach(b => b.onclick = () => {
      const t = a.tasks[+b.dataset.k], wasDone = doneShare(a) === 1;
      t.d = !t.d; b.setAttribute("aria-checked", t.d);
      $("mpFill").style.transform = `scale(${mpScale(a)})`;
      if (!wasDone && doneShare(a) === 1) toast(`Lupeň ${a.name} rozkvitol`);
    });
    setTimeout(() => $("shClose").focus(), 50);
  }
  function closeSheet() {
    if (state.sheet == null) return;
    const i = state.sheet; state.sheet = null;
    $("scrim").classList.remove("show"); $("sheet").classList.remove("show");
    setTimeout(() => { $("scrim").hidden = true; $("sheet").hidden = true; }, 320);
    if (showFlower()) {
      updatePetals();
      const g = $("fl").querySelector(`.petal[data-i="${i}"]`);
      if (g) { g.classList.remove("pop"); void g.getBBox(); g.classList.add("pop"); setTimeout(() => g.classList.remove("pop"), 1100); }
    }
    renderToday();
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  $("scrim").addEventListener("click", closeSheet);

  // —— rozkvet rýchlych akcií ——
  let curActions = [];
  function openBloom(viaKeyboard) {
    if (state.bloom) return;
    state.bloom = true; state.hintSeen = true;
    $("hint").hidden = true; $("stage").classList.remove("hintpulse");
    curActions = state.phase === "pred" ? ACTIONS.pred(week()) : state.variant === "flower" ? ACTIONS.poFlower() : ACTIONS.poRing();
    const cr = $("center").getBoundingClientRect(), cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;
    const stageW = $("stage").getBoundingClientRect().width;
    const R = Math.max(112, Math.min(132, stageW * .40));
    const n = curActions.length;
    $("bloom").innerHTML = curActions.map((a, i) => {
      const ang = -90 + i * 360 / n, rad = ang * Math.PI / 180, x = cx + R * Math.cos(rad), y = cy + R * Math.sin(rad);
      const live = a.timer && state.timer?.kind === a.timer;
      return `<button class="bub${live ? " live" : ""}" role="menuitem" data-i="${i}" aria-label="${a.aria || a.l}"
        style="left:${x}px;top:${y}px;--dx:${(cx - x).toFixed(1)}px;--dy:${(cy - y).toFixed(1)}px;--d:${i * 35}ms">
        <span class="c">${icon(a.ic)}</span><span class="l">${a.l}</span></button>`;
    }).join("");
    $("dim").hidden = false; $("bloom").hidden = false;
    $("fcard").classList.add("raised"); $("stage").classList.add("zoom");
    $("center").classList.add("open"); $("center").setAttribute("aria-expanded", "true");
    renderCenter();
    void $("bloom").offsetWidth; // vynúti výpočet štýlu, aby prechod z výchozej polohy začal hneď
    $("dim").classList.add("show"); $("bloom").classList.add("show");
    if (viaKeyboard) setTimeout(() => $("bloom").querySelector(".bub")?.focus(), 60);
  }
  function closeBloom(refocus) {
    if (!state.bloom) return;
    state.bloom = false;
    $("dim").classList.remove("show"); $("bloom").classList.remove("show");
    $("stage").classList.remove("zoom"); $("center").classList.remove("open"); $("center").setAttribute("aria-expanded", "false");
    renderCenter();
    setTimeout(() => { if (!state.bloom) { $("dim").hidden = true; $("bloom").hidden = true; $("bloom").innerHTML = ""; $("fcard").classList.remove("raised"); } }, 380);
    if (refocus) $("center").focus();
  }
  function runAction(i) {
    const a = curActions[i]; if (!a) return;
    closeBloom(false);
    if (a.timer) startTimer(a.timer); else toast(a.t);
  }
  $("bloom").addEventListener("click", e => { const b = e.target.closest(".bub"); if (b) runAction(+b.dataset.i); });
  $("dim").addEventListener("click", () => closeBloom(true));

  // stred: ťuk = otvorí/zavrie, podržanie = zoom + vibrácia; pri podržaní sa dá rovno potiahnuť na ikonu
  const HOLD = 420;
  let hold = null, heldOpen = false, ignoreClick = false;
  const center = $("center");
  center.addEventListener("contextmenu", e => e.preventDefault());
  $("stage").addEventListener("contextmenu", e => e.preventDefault());
  center.addEventListener("pointerdown", e => {
    if (e.button > 0 || state.bloom) return;
    heldOpen = false;
    const sx = e.clientX, sy = e.clientY;
    try { center.setPointerCapture(e.pointerId); } catch (_) {}
    $("stage").classList.add("holding");
    hold = { sx, sy, t: setTimeout(() => {
      $("stage").classList.remove("holding");
      heldOpen = true; openBloom(false);
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_) {} }
    }, HOLD) };
  });
  const bubAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest(".bub") : null; };
  center.addEventListener("pointermove", e => {
    if (!hold) return;
    if (!heldOpen) { if (Math.hypot(e.clientX - hold.sx, e.clientY - hold.sy) > 12) cancelHold(); return; }
    const b = bubAt(e.clientX, e.clientY);
    $("bloom").querySelectorAll(".bub").forEach(x => x.classList.toggle("over", x === b));
  });
  function cancelHold() { if (hold) clearTimeout(hold.t); hold = null; $("stage").classList.remove("holding"); }
  center.addEventListener("pointerup", e => {
    if (!hold) return;
    cancelHold();
    if (!heldOpen) return; // krátky ťuk – vybaví click
    ignoreClick = true; setTimeout(() => ignoreClick = false, 400);
    const b = bubAt(e.clientX, e.clientY);
    if (b) return runAction(+b.dataset.i);
    const cr = center.getBoundingClientRect();
    const onCenter = e.clientX >= cr.left && e.clientX <= cr.right && e.clientY >= cr.top && e.clientY <= cr.bottom;
    if (!onCenter) closeBloom(false); // pustenie mimo zavrie; pustenie na strede nechá ikony otvorené
  });
  center.addEventListener("pointercancel", () => { cancelHold(); });
  center.addEventListener("click", e => {
    if (ignoreClick) return;
    if (state.bloom) closeBloom(true); else openBloom(e.detail === 0);
  });
  $("pill").addEventListener("pointerdown", e => e.stopPropagation());
  $("pill").addEventListener("click", e => { e.stopPropagation(); stopTimer(); });

  // lupene a segmenty kruhu
  $("fl").addEventListener("click", e => {
    if (state.bloom) return;
    const g = e.target.closest(".petal"); if (g) return openSheet(+g.dataset.i);
    const s = e.target.closest(".seg-r"); if (s) return ringTap(s.dataset.k);
  });
  $("fl").addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const g = e.target.closest(".petal, .seg-r"); if (!g) return;
    e.preventDefault(); g.dispatchEvent(new MouseEvent("click", { bubbles: true }));
  });
  function ringTap(k) {
    if (k === "diaper") return toast("Otvorí malé okno Plienky – nič sa neuloží hneď");
    startTimer(k);
  }

  // klávesnica: Esc a fokus v okne / v rozkvete
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { if (state.sheet != null) closeSheet(); else if (state.bloom) closeBloom(true); return; }
    if (e.key !== "Tab") return;
    const box = state.sheet != null ? $("sheet") : state.bloom ? null : null;
    let items;
    if (box) items = [...box.querySelectorAll("button")];
    else if (state.bloom) items = [center, ...$("bloom").querySelectorAll(".bub")];
    if (!items || !items.length) return;
    const i = items.indexOf(document.activeElement);
    e.preventDefault();
    items[(i + (e.shiftKey ? -1 : 1) + items.length) % items.length].focus();
  });
  $("bloom").addEventListener("keydown", e => {
    if (!["ArrowRight", "ArrowLeft", "ArrowDown", "ArrowUp"].includes(e.key)) return;
    const items = [...$("bloom").querySelectorAll(".bub")], i = items.indexOf(document.activeElement);
    e.preventDefault(); items[(i + (e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus();
  });

  // —— hlásenie ——
  let toastT = null;
  function toast(text, act, fn) {
    $("toastText").textContent = text;
    const b = $("toastAct"); b.hidden = !act; b.textContent = act || ""; b.onclick = () => { $("toast").classList.remove("show"); fn && fn(); };
    $("toast").classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => $("toast").classList.remove("show"), act ? 5000 : 2600);
  }
  document.addEventListener("click", e => { const t = e.target.closest("[data-toast]"); if (t) toast(t.dataset.toast); });

  // —— ovládanie prototypu ——
  $("protoBtn").onclick = () => { const o = $("proto").classList.toggle("open"); $("protoBtn").setAttribute("aria-expanded", o); };
  const set = fn => () => { closeBloom(false); closeSheet(); fn(); render(); };
  $("pPred").onclick = set(() => state.phase = "pred");
  $("pPo").onclick = set(() => { state.phase = "po"; });
  $("vRing").onclick = set(() => state.variant = "ring");
  $("vFlower").onclick = set(() => state.variant = "flower");
  $("pWeek").onclick = set(() => { const p = state.phase; state.wi[p] = (state.wi[p] + 1) % WEEKS[p].length; });
  const night = set(() => state.night = !state.night);
  $("pNight").onclick = night; $("moonBtn").onclick = night;
  $("pReset").onclick = set(() => { state.hintSeen = false; state.timer = { kind: "sleep", start: Date.now() - 47 * 60000 }; state.areas = { pred: clone(PRED), po: clone(PO) }; });

  state.timer = { kind: "sleep", start: Date.now() - 47 * 60000 }; // ako v ukážke appky
  render();
})();
</script>
</body>
</html>

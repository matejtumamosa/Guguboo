<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp – rýchle záznamy na domove (varianty A–D)</title>
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
/* Prototyp kruhu rýchlych záznamov (16. 11. 2026). Len náhľad – appka naň neodkazuje, nič sa neukladá.
   Zvyšok domova je schválne len sivé zástupné bloky. Ikony = cesty z iconPaths (v5-mobile.js). */
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Montserrat,"Segoe UI",system-ui,sans-serif;font-weight:600;color:#29243a;background:#f3f0f8;transition:background .3s}
body.pg-night{background:#100e1d;color:#f1ecff}
button{font:inherit;color:inherit;cursor:pointer}

/* ——— ovládanie náhľadu ——— */
.ctl{position:relative;z-index:20;padding:12px 16px 10px;background:rgba(243,240,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(117,96,181,.14)}
body.pg-night .ctl{background:rgba(16,14,29,.9);border-color:rgba(201,192,255,.14)}
.ctl h1{margin:0 0 8px;font-size:15px;font-weight:800}
.ctl-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg{display:inline-flex;background:#fff;border:1px solid rgba(117,96,181,.18);border-radius:14px;padding:3px;gap:2px}
body.pg-night .seg{background:#241f38;border-color:rgba(201,192,255,.18)}
.seg button{border:0;background:none;min-height:36px;padding:0 12px;border-radius:11px;font-size:13px;font-weight:700;color:#5d5768}
body.pg-night .seg button{color:#c4bcda}
.seg button[aria-pressed=true]{background:#5f4fb1;color:#fff}
body.pg-night .seg button[aria-pressed=true]{background:#c9c0ff;color:#241f38}
.seg button:focus-visible{outline:2px solid #6a4fc4;outline-offset:2px}
.info{margin:8px 0 0;font-size:13px;line-height:1.45;color:#5d5768;max-width:820px}
body.pg-night .info{color:#c4bcda}
.info b{color:#29243a}
body.pg-night .info b{color:#f1ecff}

.phones{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start;padding:22px 12px 40px}
.ph-cap{font-size:12px;font-weight:700;color:#8d879a;text-align:center;margin-bottom:6px}

/* ——— telefón ——— */
.phone{--ink:#29243a;--muted:#5d5768;--card:#fff;--card2:#fbf8ff;--line:rgba(117,96,181,.14);--ph:#ebe7f1;--phl:#9a94a7;--bg:#fbf8fc;
  --pk-a:#fde4eb;--pk-b:#f6bfd0;--pk-ic:#a24766;--pk-tx:#7d2f4c;
  --pc-a:#fff1e2;--pc-b:#f8cfa6;--pc-ic:#8a5414;--pc-tx:#6e4210;
  --li-a:#eeebff;--li-b:#cbc6f4;--li-ic:#5f4fb1;--li-tx:#463a8f;
  --ctr:#fff;--stop:#5f4fb1;--stopt:#fff;
  position:relative;border-radius:34px;background:var(--bg);overflow:hidden;box-shadow:0 18px 50px rgba(41,36,58,.18),0 0 0 8px #fff,0 0 0 9px rgba(117,96,181,.18);color:var(--ink)}
.phone.night{--ink:#f1ecff;--muted:#c4bcda;--card:#241f38;--card2:#211c34;--line:rgba(201,192,255,.14);--ph:#272239;--phl:#7f78a0;--bg:#17142a;
  --pk-a:#4a2a42;--pk-b:#5e3352;--pk-ic:#f7b6c8;--pk-tx:#fbd3de;
  --pc-a:#46332a;--pc-b:#5a3f2c;--pc-ic:#f6c89f;--pc-tx:#fde0c4;
  --li-a:#2e2a54;--li-b:#3b3570;--li-ic:#c9c0ff;--li-tx:#e1dbff;
  --ctr:#2c2645;--stop:#c9c0ff;--stopt:#241f38;
  box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 8px #241f38,0 0 0 9px rgba(201,192,255,.2)}
.t-pk{--a:var(--pk-a);--b:var(--pk-b);--ic:var(--pk-ic);--tx:var(--pk-tx)}
.t-pc{--a:var(--pc-a);--b:var(--pc-b);--ic:var(--pc-ic);--tx:var(--pc-tx)}
.t-li{--a:var(--li-a);--b:var(--li-b);--ic:var(--li-ic);--tx:var(--li-tx)}
.ic{width:100%;height:100%;display:block;fill:currentColor}

.blk{position:absolute;left:16px;right:16px;border-radius:20px;background:var(--ph);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--phl)}
.blk.nav{left:0;right:0;bottom:0;border-radius:24px 24px 0 0}
.card{position:absolute;left:16px;right:16px;border-radius:24px;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);box-shadow:0 6px 22px rgba(95,79,177,.07);overflow:hidden}
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}

/* stred (A, B, C) */
.ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--line);background:var(--ctr);box-shadow:0 6px 18px rgba(95,79,177,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;color:var(--ink)}
.ctr strong{font-size:15px;font-weight:800;line-height:1.15}
.ctr .lnk{font-size:12px;font-weight:700;color:var(--li-tx)}
.ctr .cic{width:20px;height:20px;color:var(--li-ic)}
.ctr small{font-size:12px;font-weight:700;color:var(--muted)}
.ctr .tm{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.1}
.ctr .stop{margin-top:3px;font-size:11px;font-weight:800;background:var(--stop);color:var(--stopt);border-radius:999px;padding:4px 10px}
.ctr .stop{white-space:nowrap}
.ctr.oval{border-radius:999px}
.ctr.sm small{display:none}.ctr.sm .tm{font-size:18px}.ctr.sm .cic{width:16px;height:16px}
.ctr:focus-visible,.bub:focus-visible,.disc:focus-visible,.sb:focus-visible,.pill:focus-visible{outline:3px solid #6a4fc4;outline-offset:3px}
.phone.night .ctr:focus-visible,.phone.night .bub:focus-visible,.phone.night .disc:focus-visible,.phone.night .sb:focus-visible,.phone.night .pill:focus-visible{outline-color:#c9c0ff}

/* ——— A: mäkké diely ——— */
.va path.sec{cursor:pointer;transition:transform .25s ease,filter .25s;transform-box:view-box;transform-origin:50% 50%}
.va path.sec:focus{outline:none}
.va path.sec:focus-visible{filter:drop-shadow(0 0 0 #6a4fc4) drop-shadow(0 0 3px #6a4fc4)}
.va path.sec.on{animation:breathe 3.6s ease-in-out infinite}
.va path.sec.tap{animation:pressSec .28s ease}
.va .lab{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;color:var(--ic)}
.va .lab .i{display:block}
.lab .nm,.bub .nm,.dlab .nm{font-size:12px;font-weight:800;color:var(--tx);line-height:1.1;white-space:nowrap}
.lab .sub,.bub .sub,.dlab .sub{font-size:11px;font-weight:700;color:var(--tx);opacity:.92;line-height:1.1;white-space:nowrap}

/* ——— B: bubliny ——— */
.orbit{position:absolute;border-radius:50%;border:1.5px dashed rgba(117,96,181,.22);left:50%;top:50%;transform:translate(-50%,-50%)}
.phone.night .orbit{border-color:rgba(201,192,255,.2)}
.bwrap{position:absolute;transform:translate(-50%,-50%)}
.bwrap.f1{animation:floaty 6s ease-in-out infinite}.bwrap.f2{animation:floaty 6s ease-in-out -2s infinite}.bwrap.f3{animation:floaty 6s ease-in-out -4s infinite}
.bub{position:relative;width:100%;height:100%;border-radius:50%;border:0;padding:0;color:var(--ic);background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0,var(--a) 34%,var(--b) 100%);box-shadow:0 10px 22px rgba(95,79,177,.14),inset 0 -6px 14px rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .25s ease}
.phone.night .bub{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.16) 0,var(--a) 38%,var(--b) 100%);box-shadow:0 10px 22px rgba(0,0,0,.35)}
.bub.tap{animation:pop .3s ease}
.bub .runo{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);animation:spin 7s linear infinite;pointer-events:none}
.bub .runo circle{fill:none;stroke:var(--ic);stroke-width:2.5;stroke-linecap:round}

/* ——— C: tenký prstenec ——— */
.vc .rsvg{position:absolute;inset:0;overflow:visible}
.vc .runarc{transform-box:view-box;transform-origin:50% 50%;animation:spin 9s linear infinite}
.disc{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--b);background:var(--ctr);color:var(--ic);padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(95,79,177,.12);transition:transform .25s ease}
.disc.on{background:radial-gradient(circle at 35% 30%,var(--a),var(--b));border-color:var(--ic)}
.disc.tap{animation:pop .3s ease}
.disc .dot{position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--ic);border:2px solid var(--ctr)}
.vc .ctr{background:transparent;border:0;box-shadow:none}
.vc .ctr .mini{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.vc .ctr .row{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.vc .ctr .row i{width:15px;height:15px;color:var(--ic);display:block}
.vc .ctr .tm{font-size:28px}
.vc .ctr.sm .tm{font-size:20px}

/* ——— D: živá scéna ——— */
.card.vd{border:0;background:none;box-shadow:0 8px 26px rgba(95,79,177,.14)}
.scene{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:linear-gradient(165deg,#f3edff 0%,#fbf1fb 45%,#fff2ea 100%);transition:transform .38s cubic-bezier(.3,.7,.2,1),filter .4s}
.phone.night .scene{background:linear-gradient(170deg,#211d45 0%,#2d2758 55%,#3a2f63 100%)}
.scene.zoom{transform:scale(1.12)}
.scene.dim::after{content:"";position:absolute;inset:0;background:rgba(70,58,143,.13);pointer-events:none;transition:opacity .6s}
.scene svg.sky{position:absolute;inset:0;width:100%;height:100%}
.cloud{animation:drift 26s ease-in-out infinite alternate}.cloud.c2{animation-duration:34s;animation-delay:-9s}
.star{animation:twinkle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.star.s2{animation-delay:-1.1s}.star.s3{animation-delay:-2.2s}.star.s4{animation-delay:-.6s}
.hero{position:absolute;left:50%;transform:translateX(-50%)}
.hero svg{width:100%;height:100%;overflow:visible}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breatheY 4s ease-in-out infinite}
.breathe2{transform-box:fill-box;transform-origin:50% 50%;animation:breathe 5.5s ease-in-out infinite}
.sway{transform-box:fill-box;transform-origin:50% 50%;animation:sway 7s ease-in-out infinite}
.zz{font-weight:800;fill:#8171ce;animation:zz 3.6s ease-in infinite;opacity:0}
.phone.night .zz{fill:#c9c0ff}
.zz.z2{animation-delay:-1.2s;font-size:14px}.zz.z3{animation-delay:-2.4s;font-size:11px}
.wavering{fill:none;stroke:#f07f98;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ringOut 4s ease-out infinite;opacity:0}
.wavering.w2{animation-delay:-2s}
.sbw{position:absolute;transform:translate(-50%,0);display:flex;flex-direction:column;align-items:center;gap:4px}
.sb{border-radius:50%;border:1px solid rgba(117,96,181,.16);background:rgba(255,255,255,.8);backdrop-filter:blur(6px);color:var(--ic);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 8px 20px rgba(95,79,177,.16);transition:transform .25s ease}
.phone.night .sb{background:rgba(255,255,255,.1);border-color:rgba(201,192,255,.22);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.sb.on{background:radial-gradient(circle at 35% 30%,var(--a),var(--b));border-color:var(--ic)}
.sb.tap{animation:pop .3s ease}
.sbw .sub,.sbw .nm{font-size:11px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.62);padding:1px 7px;border-radius:999px;white-space:nowrap}
.sbw .nm{font-weight:800}
.phone.night .sbw .sub,.phone.night .sbw .nm{background:rgba(23,20,42,.5)}
.pill{position:absolute;left:12px;top:12px;min-height:44px;display:flex;align-items:center;gap:8px;border-radius:999px;border:1px solid rgba(117,96,181,.16);background:rgba(255,255,255,.82);backdrop-filter:blur(6px);padding:4px 6px 4px 12px;font-size:13px;font-weight:800;color:var(--ink)}
.phone.night .pill{background:rgba(255,255,255,.1);border-color:rgba(201,192,255,.22)}
.pill .pi{width:18px;height:18px;color:var(--li-ic)}
.pill .tm{font-variant-numeric:tabular-nums;font-size:15px}
.pill .stop{font-size:11px;font-weight:800;background:var(--stop);color:var(--stopt);border-radius:999px;padding:6px 10px}
.pill .lnk{font-size:12px;font-weight:700;color:var(--li-tx);padding-right:8px}

/* ——— okno a hlásenie ——— */
.shw{position:absolute;inset:0;z-index:5;background:rgba(41,36,58,.3);opacity:0;pointer-events:none;transition:opacity .25s}
.shw.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px 26px;transform:translateY(100%);transition:transform .32s cubic-bezier(.3,.7,.2,1),clip-path .45s cubic-bezier(.3,.7,.2,1);color:var(--ink)}
.shw.open .sheet{transform:none}
.shw.reveal .sheet{transform:none;clip-path:circle(0 at var(--x) var(--y))}
.shw.reveal.open .sheet{clip-path:circle(150% at var(--x) var(--y))}
.sh-grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;gap:10px}
.sh-head .hi{width:42px;height:42px;border-radius:14px;background:var(--a);color:var(--ic);padding:9px}
.sh-head h2{margin:0;font-size:18px;font-weight:800;flex:1}
.sh-x{width:44px;height:44px;border-radius:50%;border:0;background:var(--ph);font-size:22px;line-height:1}
.sh-sub{margin:6px 0 0;font-size:14px;color:var(--muted)}
.sh-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:16px}
.sh-acts button{min-height:84px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(160deg,var(--a),var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:800;color:var(--ink)}
.sh-acts button i{width:28px;height:28px;color:var(--ic);display:block}
.sh-note{margin:14px 0 0;font-size:12px;color:var(--muted);text-align:center}
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,16px);opacity:0;z-index:6;background:#29243a;color:#fff;border-radius:999px;padding:6px 6px 6px 16px;font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.phone.night .toast{background:#f1ecff;color:#241f38}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;border-radius:999px;background:rgba(255,255,255,.16);color:inherit;min-height:34px;padding:0 12px;font-weight:800}
.phone.night .toast button{background:rgba(36,31,56,.1)}

@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes breatheY{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.05)}}
@keyframes pressSec{0%{transform:scale(1)}45%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.9)}75%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 4px))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(22px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(16px,-38px)}}
@keyframes ringOut{0%{opacity:.55;transform:scale(.85)}100%{opacity:0;transform:scale(1.35)}}

/* pohyb: systémové nastavenie aj prepínač „Bez pohybu“ */
@media (prefers-reduced-motion:reduce){.phone *,.phone{animation:none!important;transition:none!important}.zz,.wavering{display:none}}
.rm .phone *,.rm .phone{animation:none!important;transition:none!important}
.rm .zz,.rm .wavering{display:none}
</style>
</head>
<body>
<div class="ctl">
  <h1>Rýchle záznamy na domove – návrhy (len náhľad, nič sa neukladá)</h1>
  <div class="ctl-row">
    <div class="seg" role="group" aria-label="Variant" data-k="v">
      <button data-val="A">A · Mäkké diely</button><button data-val="B">B · Bubliny</button><button data-val="C">C · Prstenec</button><button data-val="D">D · Živá scéna</button>
    </div>
    <div class="seg" role="group" aria-label="Obdobie" data-k="period">
      <button data-val="prvy">Pred pôrodom (do 1. pohybu)</button><button data-val="pred">Pred pôrodom</button><button data-val="po">Po pôrode</button>
    </div>
    <div class="seg" role="group" aria-label="Deň alebo noc" data-k="night">
      <button data-val="0">Deň</button><button data-val="1">Noc</button>
    </div>
    <div class="seg" role="group" aria-label="Časovač" data-k="run">
      <button data-val="0">Nič nebeží</button><button data-val="1">Beží časovač</button>
    </div>
    <div class="seg" role="group" aria-label="Názvy pod ikonou" data-k="labels">
      <button data-val="0">Len ikony</button><button data-val="1">S názvami</button>
    </div>
    <div class="seg" role="group" aria-label="Pohyb" data-k="rm">
      <button data-val="0">S pohybom</button><button data-val="1">Bez pohybu</button>
    </div>
    <div class="seg" role="group" aria-label="Veľkosť" data-k="size">
      <button data-val="both">Obe</button><button data-val="390">390 × 844</button><button data-val="375">375 × 667</button>
    </div>
  </div>
  <p class="info" id="info"></p>
</div>
<div class="phones" id="phones"></div>

<script>

  // ——— stav náhľadu ———
  const st = { v: "A", period: "po", night: "0", run: "0", labels: "0", rm: "0", size: "both" };

  const clock = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };

  // ——— A: mäkké diely (zaoblené výseky, len ikony) ———
  function sectorPath(c, Ro, Ri, a0, a1, gap) {

    if (night()) {
      s += "<circle cx='" + (W - 46) + "' cy='38' r='30' fill='rgba(255,244,214,.12)'/><path d='M" + (W - 40) + " 20 a19 19 0 1 0 14 32 a15 15 0 1 1 -14 -32Z' fill='#fff4d6'/>";
      s += star(W * 0.18, 26, 4, "") + star(W * 0.62, 18, 3, "s2") + star(W * 0.08, H * 0.55, 3, "s3") + star(W * 0.92, H * 0.5, 4, "s4") + star(W * 0.36, H * 0.18, 2.5, "s3") + star(W * 0.78, H * 0.32, 2.5, "s2");
    } else {
      s += "<circle cx='" + (W - 44) + "' cy='36' r='34' fill='rgba(246,200,159,.22)'/><circle cx='" + (W - 44) + "' cy='36' r='18' fill='#f9d8b5'/>";
      s += "<g class='cloud'><rect x='" + W * 0.1 + "' y='28' width='58' height='18' rx='9' fill='#fff' opacity='.85'/><rect x='" + (W * 0.1 + 14) + "' y='18' width='28' height='22' rx='11' fill='#fff' opacity='.85'/></g>";
      s += "<g class='cloud c2'><rect x='" + W * 0.55 + "' y='" + H * 0.42 + "' width='44' height='14' rx='7' fill='#fff' opacity='.6'/></g>";
      s += star(W * 0.3, H * 0.3, 4, "s2") + star(W * 0.82, H * 0.62, 3.5, "s3");
    }
    return s + "</svg>";
  }
  function babyArt() {
    const rn = running(), asleep = (rn && rn.key === "sleep") || night();
    const skin = night() ? "#e8c6b3" : "#fbe0cf", line = "#8a5a4a";
    if (st.period === "po") {
      return "<svg viewBox='0 0 200 190' aria-hidden='true'>" +
        "<ellipse cx='100' cy='98' rx='92' ry='84' fill='" + (night() ? "rgba(201,192,255,.10)" : "rgba(255,255,255,.55)") + "'/>" +
        "<ellipse cx='100' cy='128' rx='80' ry='26' fill='" + (night() ? "#3b3570" : "#fff") + "'/>" +
        "<circle cx='100' cy='94' r='38' fill='" + skin + "'/>" +
        "<path d='M96 58 q6 -10 14 -4' fill='none' stroke='#e2b79e' stroke-width='3' stroke-linecap='round'/>" +
        "<circle cx='78' cy='106' r='7' fill='#f7b9c6' opacity='.75'/><circle cx='122' cy='106' r='7' fill='#f7b9c6' opacity='.75'/>" +
        (asleep ? "<path d='M80 95 q7 6 14 0 M106 95 q7 6 14 0' fill='none' stroke='" + line + "' stroke-width='3' stroke-linecap='round'/>" : "<circle cx='87' cy='95' r='4' fill='" + line + "'/><circle cx='113' cy='95' r='4' fill='" + line + "'/>") +
        "<path d='M94 112 q6 4 12 0' fill='none' stroke='" + line + "' stroke-width='2.5' stroke-linecap='round'/>" +
        "<g class='breathe'><path d='M20 140 Q100 112 180 140 L180 168 Q100 188 20 168Z' fill='" + (night() ? "#4a4290" : "#d9d2fb") + "'/>" +
        "<circle cx='60' cy='150' r='3' fill='#fff' opacity='.7'/><circle cx='100' cy='146' r='3' fill='#fff' opacity='.7'/><circle cx='140' cy='150' r='3' fill='#fff' opacity='.7'/><circle cx='80' cy='164' r='3' fill='#fff' opacity='.7'/><circle cx='120' cy='164' r='3' fill='#fff' opacity='.7'/></g>" +
        (asleep ? "<text class='zz' x='142' y='70' font-size='17'>z</text><text class='zz z2' x='150' y='60'>z</text><text class='zz z3' x='158' y='50'>z</text>" : "") +
        "</svg>";
    }
    const contr = rn && rn.key === "contraction";
    return "<svg viewBox='0 0 200 200' aria-hidden='true'><defs><radialGradient id='bellyG' cx='.4' cy='.35' r='.75'><stop offset='0' stop-color='" + (night() ? "#6a4a78" : "#fff3f6") + "'/><stop offset='1' stop-color='" + (night() ? "#4b3157" : "#f7c6d4") + "'/></radialGradient></defs>" +
      (contr ? "<circle class='wavering' cx='100' cy='100' r='84'/><circle class='wavering w2' cx='100' cy='100' r='84'/>" : "") +
      "<g class='breathe2'><circle cx='100' cy='100' r='82' fill='url(#bellyG)'/><circle cx='100' cy='100' r='64' fill='" + (night() ? "rgba(255,255,255,.06)" : "rgba(255,255,255,.4)") + "'/>" +
      "<g class='sway'>" +
      "<path d='M98 104 C134 94 154 122 144 146 C136 164 110 168 94 158 C80 149 80 124 98 104Z' fill='" + skin + "'/>" +
      "<ellipse cx='122' cy='150' rx='22' ry='13' transform='rotate(-24 122 150)' fill='" + skin + "' stroke='" + (night() ? "#cfa995" : "#f0c7b2") + "' stroke-width='2'/>" +
      "<circle cx='90' cy='82' r='31' fill='" + skin + "'/>" +
      "<path d='M114 74 a7 7 0 0 1 2 12' fill='none' stroke='" + (night() ? "#cfa995" : "#efc0aa") + "' stroke-width='3' stroke-linecap='round'/>" +
      "<path d='M74 86 q6 5 12 0' fill='none' stroke='" + line + "' stroke-width='3' stroke-linecap='round'/><circle cx='76' cy='97' r='5.5' fill='#f7b9c6' opacity='.75'/>" +
      "<path d='M84 104 q4 3 8 0' fill='none' stroke='" + line + "' stroke-width='2.2' stroke-linecap='round'/>" +
      "<circle cx='104' cy='114' r='8.5' fill='" + skin + "' stroke='" + (night() ? "#cfa995" : "#f0c7b2") + "' stroke-width='2'/></g></g>" +
      "<path d='M150 40 c-4 -8 -14 -4 -10 4 l10 10 l10 -10 c4 -8 -6 -12 -10 -4Z' fill='#f07f98' opacity='.75'/>" +
      "</svg>";
  }
  function variantD(W, H) {
    const ks = segs(), rn = running(), short = H < 260;
    const bd = short ? 52 : 62, showSub = !short;
    const bottomRow = bd + (showSub || st.labels === "1" ? 22 : 0) + 12;
    const artH = short ? Math.min(H - bottomRow - 6, W * 0.56) : Math.min(H - bottomRow - 58, W * 0.62), artTop = short ? 8 : 52;
    const xs = [0.2, 0.5, 0.8];
    const pill = rn
      ? "<button class='pill' data-act='stop' aria-label='" + esc(rn.what + " – " + rn.stop) + "'><span class='pi'>" + ico(rn.icon, true) + "</span>" + esc(rn.what) + " <b class='tm' data-since='" + rn.key + "'>" + clock(Date.now() - starts[rn.key]) + "</b><span class='stop'>" + esc(rn.stop) + "</span></button>"
      : "<button class='pill' data-act='day' aria-label='" + dayName() + " – prehľad dnešných zápisov'>" + dayName() + "<span class='lnk'>Prehľad</span></button>";
    let bubs = "";
    ks.forEach((k, i) => {
      const on = rn && rn.key === k, ics = Math.round(bd * 0.46);
      const top = H - bottomRow + (i === 1 ? 4 : -4);
      bubs += "<div class='sbw " + SEG[k].t + "' style='left:" + (xs[i] * 100) + "%;top:" + top + "px'><button class='sb" + (on ? " on" : "") + "' data-seg='" + k + "' aria-label='" + esc(aria(k)) + "' style='width:" + bd + "px;height:" + bd + "px'><span style='width:" + ics + "px;height:" + ics + "px;display:block'>" + ico(SEG[k].icon, on) + "</span></button>" + labelHtml(k, showSub) + "</div>";
    });
    const dim = rn && rn.key === "sleep" && !night() ? " dim" : "";
    return "<div class='scene" + dim + "'>" + sky(W, H) + "<div class='hero' style='" + (short ? "left:60%;" : "") + "top:" + artTop + "px;width:" + artH + "px;height:" + artH + "px'>" + babyArt() + "</div>" + bubs + pill + "</div>";
  }

  // ——— telefón ———
  let uidN = 0;
  function renderPhone(host, size) {
    const z = SIZES[size], uid = "u" + (++uidN);
    const top = { header: 12, ask: 84 }; top.hero = top.ask + 44 + z.gap; top.shorts = top.hero + 72 + z.gap; top.card = top.shorts + z.shorts + z.gap; top.today = top.card + z.card + z.gap;
    const cw = z.w - 32, ch = z.card;
    const body = st.v === "A" ? variantA(cw, ch, uid) : st.v === "B" ? variantB(cw, ch) : st.v === "C" ? variantC(cw, ch, uid) : variantD(cw, ch);
    host.innerHTML = "<div class='ph-cap'>" + z.w + " × " + z.h + "</div><div class='phone" + (night() ? " night" : "") + "' style='width:" + z.w + "px;height:" + z.h + "px'>" +
      "<div class='blk' style='top:" + top.header + "px;height:58px'>hlavička</div>" +
      "<div class='blk' style='top:" + top.ask + "px;height:44px'>hľadanie</div>" +
      "<div class='blk' style='top:" + top.hero + "px;height:72px'>týždeň / vek</div>" +
      "<div class='blk' style='top:" + top.shorts + "px;height:" + z.shorts + "px'>3 skratky</div>" +
      "<section class='card" + (st.v === "D" ? " vd" : "") + "' style='top:" + top.card + "px;height:" + ch + "px' aria-label='Rýchle záznamy'>" + body + "</section>" +
      "<div class='blk' style='top:" + top.today + "px;height:60px'>Dnes stačí jedno</div>" +
      "<div class='blk nav' style='height:" + (z.h - top.today - 60 - z.gap) + "px'>lišta</div>" +
      "<div class='shw'><div class='sheet' role='dialog' aria-modal='true'></div></div><div class='toast' role='status'></div></div>";
  }

  function fit() {
    const wrap = document.getElementById("phones");
    const sizes = st.size === "both" ? ["390", "375"] : [st.size];
    const total = sizes.reduce((a, s) => a + SIZES[s].w + 30, 0);
    const zw = Math.min(1, (window.innerWidth - 24) / total);
    wrap.style.zoom = zw < 1 ? zw.toFixed(3) : "";
  }
  function render() {
    document.querySelectorAll(".seg").forEach(g => g.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(st[g.dataset.k] === b.dataset.val))));
    document.body.classList.toggle("pg-night", night());
    document.body.classList.toggle("rm", st.rm === "1");
    const wrap = document.getElementById("phones");
    const sizes = st.size === "both" ? ["390", "375"] : [st.size];
    wrap.innerHTML = sizes.map(() => "<div class='phw'></div>").join("");
    sizes.forEach((s, i) => renderPhone(wrap.children[i], s));
    document.getElementById("info").innerHTML = INFO[st.v] + (st.period === "prvy" && st.run === "1" ? " <b>Do 1. pohybu nič nebeží</b> – časovač kontrakcií je až od 36. týždňa (zvoľ „Pred pôrodom“)." : "");
    fit();
  }
  const INFO = {
    A: "<b>A · Mäkké diely.</b> Tri zaoblené diely s veľkou ikonou, bez nápisov; „naposledy“ len drobne pod ikonou (na malej obrazovke je v popise pre čítačku). Najbližšie dnešnému kruhu – identita ostáva, ubudne text. Bežiaci diel pomaly „dýcha“.",
    B: "<b>B · Bubliny.</b> Tri samostatné okrúhle bubliny okolo stredu, jemne sa vznášajú; bežiaci záznam má okolo bubliny pomaly obiehajúci oblúk. Hravejšie, ale stále pokojné.",
    C: "<b>C · Tenký prstenec.</b> Tenký farebný kruh, na ňom tri ikony; v strede „Náš deň“ s prehľadom „naposledy“ (ikona + čas) alebo veľký časovač, okolo ktorého obieha svetlý oblúk. Najčistejšie, najmenej farby.",
    D: "<b>D · Živá scéna (nie kruh).</b> Miniaplikácia: bábätko v brušku / spiace pod dekou, ktoré pokojne dýcha; cez deň obláčiky, v noci mesiac a hviezdy. Tri záznamy sú bubliny v scéne, časovač je pilulka hore. Ťuk na bublinu scénu jemne priblíži a okno sa otvorí kruhom z bubliny."
  };

  // ——— interakcia ———
  function toast(ph, text, undo) {
    const t = ph.querySelector(".toast");
    t.innerHTML = esc(text) + (undo ? "<button type='button' data-act='undo'>Vrátiť</button>" : "");
    t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3200);
  }
  const reduced = () => st.rm === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches;
  function openSheet(ph, k, fromEl) {
    const s = SEG[k], shw = ph.querySelector(".shw"), sh = shw.querySelector(".sheet");
    const acts = k === "contraction" && run() ? [["wave", "Skončila", "stop"]] : k === "sleep" && run() ? [["moon", "Zobudilo sa", "stop"]] : s.acts;
    sh.className = "sheet " + s.t;
    sh.setAttribute("aria-label", s.label);
    sh.innerHTML = "<div class='sh-grip'></div><div class='sh-head'><span class='hi'>" + ico(s.icon, true) + "</span><h2 tabindex='-1'>" + esc(s.label) + "</h2><button class='sh-x' data-act='close' aria-label='Zavrieť'>×</button></div>" +
      (s.sub() ? "<p class='sh-sub'>Naposledy " + esc(s.sub()) + "</p>" : "") +
      "<div class='sh-acts'>" + acts.map(a => "<button type='button' data-act='" + a[2] + "' data-k='" + k + "'><i>" + ico(a[0]) + "</i>" + esc(a[1]) + "</button>").join("") + "</div><p class='sh-note'>Náhľad – nič sa neukladá.</p>";
    shw.classList.toggle("reveal", st.v === "D" && !reduced());
    if (st.v === "D" && fromEl) {
      const pr = ph.getBoundingClientRect(), br = fromEl.getBoundingClientRect(), sr = sh.getBoundingClientRect();
      // poloha bubliny v súradniciach okna (v %, aby nezáležalo na zoom)
      sh.style.setProperty("--x", ((br.left + br.width / 2 - pr.left) / pr.width * 100).toFixed(1) + "%");
      sh.style.setProperty("--y", ((br.top + br.height / 2 - sr.top) / sr.height * 100).toFixed(1) + "%");
    }
    requestAnimationFrame(() => { shw.classList.add("open"); setTimeout(() => sh.querySelector("h2").focus({ preventScroll: true }), 60); });
    ph._ret = fromEl;
  }
  function closeSheet(ph) {
    const shw = ph.querySelector(".shw");
    shw.classList.remove("open");
    ph.querySelector(".scene")?.classList.remove("zoom");
    ph._ret?.focus?.({ preventScroll: true });
  }

  document.addEventListener("click", e => {
    const g = e.target.closest(".seg button");
    if (g) { st[g.parentElement.dataset.k] = g.dataset.val; render(); return; }
    const ph = e.target.closest(".phone"); if (!ph) return;
    if (e.target.classList.contains("shw")) { closeSheet(ph); return; }
    const seg = e.target.closest("[data-seg]");
    if (seg) {
      const k = seg.dataset.seg;
      seg.classList.remove("tap"); void seg.getBoundingClientRect(); seg.classList.add("tap");
      if (st.v === "D" && !reduced()) {
        const sc = ph.querySelector(".scene"), sr = sc.getBoundingClientRect(), br = seg.getBoundingClientRect();
        sc.style.transformOrigin = ((br.left + br.width / 2 - sr.left) / sr.width * 100).toFixed(1) + "% " + ((br.top + br.height / 2 - sr.top) / sr.height * 100).toFixed(1) + "%";
        sc.classList.add("zoom");
        setTimeout(() => openSheet(ph, k, seg), 260);
      } else setTimeout(() => openSheet(ph, k, seg), reduced() ? 0 : 200);
      return;
    }
    const act = e.target.closest("[data-act]"); if (!act) return;
    const a = act.dataset.act;
    if (a === "close") closeSheet(ph);
    else if (a === "save") { closeSheet(ph); toast(ph, "Uložené", true); }
    else if (a === "start") {
      closeSheet(ph);
      if (act.dataset.k === "contraction") { st.period = "pred"; starts.contraction = Date.now(); } else starts.sleep = Date.now();
      st.run = "1"; render(); toast(document.querySelector(".phone"), "Beží", true);
    }
    else if (a === "stop") { closeSheet(ph); st.run = "0"; render(); document.querySelectorAll(".phone").forEach(p => toast(p, "Uložené", true)); }
    else if (a === "day") toast(ph, "Otvorí prehľad dňa", false);
    else if (a === "undo") ph.querySelector(".toast").classList.remove("show");
  });
  document.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("path[data-seg]")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
    if (e.key === "Escape") document.querySelectorAll(".phone").forEach(p => { if (p.querySelector(".shw.open")) closeSheet(p); });
  });
  setInterval(() => document.querySelectorAll("[data-since]").forEach(el => { el.textContent = clock(Date.now() - starts[el.dataset.since]); }), 1000);
  window.addEventListener("resize", fit);
  render();
})();
</script>
</body>
</html>

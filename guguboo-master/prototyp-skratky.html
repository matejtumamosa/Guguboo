<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp – skratky na domove bez textu</title>
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
  /* Prototyp (Samo 27. 11.): skratky na domove len ikonou – názov ostáva pre čítačky (aria-label) a vysvetlí ho sprievodca.
     Ikony: viewBox 0 0 256 256 ako iconPaths vo v5-mobile.js; nové sú linkové, ťah 16 (= 1,5 px pri 24 px), zaoblené konce
     – rovnaký štýl ako sada kruhu z Master 3.4 (breastfeed, sleepZ, diaperFront, glassWater, capsule, doctorQ, bellyWave).
     Appka na tento súbor neodkazuje. */
  :root {
    --ink: #29243a; --muted: #5d5768; --brand: #5f4fb1; --line: rgba(92, 75, 139, .14);
    --page: #f3effa; --phone: #fbf8ff; --card: #ffffff;
    --brand-bg: #eee9ff; --brand-ic: #5f4fb1;
    --baby-bg: #eaf4fb; --baby: #2f6a8f; --mama-bg: #fdecf1; --mama: #a24766; --rod-bg: #e5f3ee; --rod: #24715f;
    --sh: 0 6px 18px rgba(58, 44, 83, .06);
  }
  .night {
    --ink: #f5f2fb; --muted: #c9c3d8; --brand: #c6bcff; --line: rgba(224, 216, 255, .16);
    --phone: #1f1a2e; --card: #2a2340;
    --brand-bg: #302d4b; --brand-ic: #c6bcff;
    --baby-bg: #24324a; --baby: #a9c4f2; --mama-bg: #3a2a3a; --mama: #f0b0c6; --rod-bg: #1f3530; --rod: #8fd6c2;
    --sh: 0 6px 18px rgba(0, 0, 0, .30);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: #29243a; font-family: Montserrat, "Segoe UI", system-ui, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: rgba(255, 255, 255, .95); border-bottom: 1px solid rgba(117, 96, 181, .12); }
  .bar strong { font-weight: 800; margin-right: 6px; }
  .grp { display: inline-flex; background: #efe9f8; border-radius: 18px; padding: 3px; }
  .grp button { border: 0; background: transparent; font: 700 13px Montserrat, system-ui, sans-serif; color: #5d5768; padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 32px; }
  .grp button[aria-pressed="true"] { background: #fff; color: #5f4fb1; box-shadow: 0 1px 4px rgba(80, 60, 140, .15); }
  h2 { font: 800 15px/20px Montserrat, system-ui, sans-serif; margin: 18px 16px 8px; color: #29243a; }
  .hint { margin: 0 16px 10px; font: 500 13px/18px Montserrat, system-ui, sans-serif; color: #5d5768; }

  /* Slepý test – všetky ikony rovnakou farbou, aby farba nenapovedala */
  .blind { display: grid; grid-template-columns: repeat(auto-fill, 76px); gap: 10px; padding: 4px 16px 8px; }
  .bt { display: grid; justify-items: center; gap: 4px; }
  .bt .ic { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: #fff; color: #5f4fb1; box-shadow: inset 0 0 0 1px rgba(92, 75, 139, .14), 0 4px 12px rgba(58, 44, 83, .05); }
  .bt .ic svg { width: 30px; height: 30px; }
  .bt b { font: 700 12px/14px Montserrat, system-ui, sans-serif; color: #8a83a0; }

  /* Telefóny */
  #stage { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 8px 16px 40px; }
  .cap { text-align: center; font: 700 12px Montserrat, system-ui, sans-serif; color: #8a83a0; margin: 0 0 6px; }
  .phone { border-radius: 30px; background: var(--phone); color: var(--ink); padding: 14px 14px 16px; box-shadow: 0 20px 50px rgba(60, 40, 120, .16); display: flex; flex-direction: column; gap: 4px; }
  .w390 { width: 390px; } .w320 { width: 320px; }
  .per { margin: 8px 2px 4px; font: 500 13px/16px Montserrat, system-ui, sans-serif; color: var(--muted); }
  .shorts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .w320 .shorts { gap: 6px; }
  .short { border: 0; font: inherit; cursor: pointer; min-height: 68px; border-radius: 20px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line), var(--sh); display: grid; place-items: center; padding: 8px; color: inherit; }
  .short:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .short:active { transform: scale(.97); }
  .short .ic { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; }
  .short .ic svg { width: 30px; height: 30px; }
  .w320 .short { min-height: 60px; }
  .w320 .short .ic { width: 44px; height: 44px; }
  .w320 .short .ic svg { width: 28px; height: 28px; }
  .c-brand .ic { background: var(--brand-bg); color: var(--brand-ic); }
  .c-baby .ic { background: var(--baby-bg); color: var(--baby); }
  .c-mama .ic { background: var(--mama-bg); color: var(--mama); }
  .c-rod .ic { background: var(--rod-bg); color: var(--rod); }
  /* Ako by vyzerala „kontrola po ťuknutí“ – názov sa ukáže len pri podržaní (návrh, nie nutnosť) */
  .tip { position: relative; }
  .tip::after { content: attr(aria-label); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; background: var(--ink); color: var(--phone); font: 700 13px/16px Montserrat, system-ui, sans-serif; padding: 6px 10px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .tip:hover::after, .tip:focus-visible::after { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .short, .tip::after { transition: none; } .short:active { transform: none; } }

  .legend { margin: 40px 16px 60px; padding-top: 18px; border-top: 2px dashed rgba(117, 96, 181, .3); font: 500 13px/19px Montserrat, system-ui, sans-serif; color: #29243a; }
  .legend table { border-collapse: collapse; width: 100%; max-width: 900px; }
  .legend th, .legend td { text-align: left; padding: 5px 8px; border-bottom: 1px solid rgba(117, 96, 181, .14); vertical-align: middle; }
  .legend td svg { width: 22px; height: 22px; color: #5f4fb1; vertical-align: middle; }
  .rec { color: #24715f; font-weight: 700; }
</style>
</head>
<body>
<div class="bar">
  <strong>Skratky bez textu</strong>
  <span class="grp" role="group" aria-label="Ikony v telefónoch">
    <button type="button" data-set="navrh" aria-pressed="true">Návrh</button>
    <button type="button" data-set="dnes" aria-pressed="false">Dnes v appke</button>
  </span>
  <span class="grp" role="group" aria-label="Farby">
    <button type="button" data-col="dnes" aria-pressed="true">Farby ako dnes</button>
    <button type="button" data-col="oblast" aria-pressed="false">Farby podľa oblasti</button>
  </span>
</div>

<h2>Slepý test – čo je čo?</h2>
<p class="hint">Pozri sa na ikonu 2 sekundy a povedz, čo by sa po ťuknutí otvorilo. Názvy sú až dole pod čiarou.</p>
<div class="blind" id="blind"></div>

<h2>Domov – riadok troch skratiek podľa obdobia</h2>

    clipHeart: L("<rect x='48' y='40' width='160' height='192' rx='20'/><rect x='92' y='22' width='72' height='38' rx='12'/>" + heart(128, 144, 44)),
    // Starostlivosť
    swaddle: L("<path d='M62,84C62,22 194,22 194,84V160C194,206 164,236 128,236C92,236 62,206 62,160Z'/><circle cx='128' cy='86' r='34'/><path d='M64,140C112,146 160,172 184,212'/>"),
    hands: L("<circle cx='128' cy='92' r='44'/><path d='M128,48C126,36 140,30 148,40'/><path d='M40,116C40,170 72,206 118,214M216,116C216,170 184,206 138,214'/><path d='M40,116C52,104 70,112 74,134M216,116C204,104 186,112 182,134'/>"),
    teddy: L("<circle cx='128' cy='136' r='80'/><path d='M60,92A28,28,0,1,1,96,62M196,92A28,28,0,1,0,160,62'/><ellipse cx='128' cy='164' rx='32' ry='24'/><path d='M120,156H136'/>") + "<circle cx='98' cy='120' r='10' fill='currentColor'/><circle cx='158' cy='120' r='10' fill='currentColor'/>",
    // Zdravotná knižka
    bookCross: L(booklet + "<path d='M136,82H164V106H188V134H164V158H136V134H112V106H136Z'/>"),
    bookBaby: L(booklet + "<circle cx='150' cy='118' r='40'/><path d='M150,78C150,66 162,62 168,70'/><path d='M138,134C146,142 154,142 162,134'/><path d='M120,196H180'/>") + "<circle cx='136' cy='112' r='7' fill='currentColor'/><circle cx='164' cy='112' r='7' fill='currentColor'/>",
    bookHeart: L(booklet + heart(150, 124, 40)),
    // Aktivity
    blocks: L("<rect x='34' y='136' width='86' height='86' rx='16'/><rect x='136' y='136' width='86' height='86' rx='16'/><rect x='85' y='34' width='86' height='86' rx='16'/>"),
    rattle: L("<circle cx='128' cy='84' r='56'/><path d='M106,148H150M128,148V186'/><circle cx='128' cy='208' r='22'/>") + "<circle cx='108' cy='74' r='9' fill='currentColor'/><circle cx='148' cy='74' r='9' fill='currentColor'/><circle cx='128' cy='104' r='9' fill='currentColor'/>",
    // Otázky pre lekára
    bubbleQ: L("<path d='M64,36H192A32,32,0,0,1,224,68V148A32,32,0,0,1,192,180H120L76,216V180H64A32,32,0,0,1,32,148V68A32,32,0,0,1,64,36Z'/><path d='M104,90A24,24,0,1,1,136,112C130,116 128,120 128,128'/>") + "<circle cx='128' cy='152' r='10' fill='currentColor'/>"
  };

  const svg = (key) => {
    const body = CUR[key] || NEW[key];
    const filled = key in CUR && key !== "doctorQ";
    return "<svg viewBox='0 0 256 256' aria-hidden='true' focusable='false'" + (filled ? " fill='currentColor'" : "") + ">" + body + "</svg>";
  };

  // Skratky: názov, oblasť (podľa skupín vo Všetko), farba dnes, súčasná ikona, kandidáti, odporúčaná
  const S = {
    common: { name: "Čo je bežné", area: "mama", col: "mama", cur: "leaf", cands: ["infoCircle", "bulb", "bubbleLeaf"], rec: "infoCircle" },
    body: { name: "Tvoje telo", area: "mama", col: "baby", cur: "mama", cands: ["bodyHeart", "mirror"], rec: "bodyHeart" },
    questions: { name: "Otázky pre lekára", area: "baby", col: "mama", cur: "question", cands: ["doctorQ", "bubbleQ"], rec: "doctorQ" },
    calendar: { name: "Kalendár", area: "rod", col: "brand", cur: "calendar", cands: [], rec: "calendar" },
    prep: { name: "Príprava na pôrod", area: "baby", col: "baby", cur: "checklist", cands: ["bagHeart", "bagCheck", "clipHeart"], rec: "bagHeart" },
    care: { name: "Starostlivosť", area: "baby", col: "mama", cur: "health", cands: ["swaddle", "hands", "teddy"], rec: "swaddle" },
    book: { name: "Zdravotná knižka", area: "baby", col: "brand", cur: "book", cands: ["bookCross", "bookBaby", "bookHeart"], rec: "bookCross" },
    activities: { name: "Aktivity", area: "baby", col: "mama", cur: "activity", cands: ["blocks", "rattle"], rec: "blocks" },
    teeth: { name: "Zúbky", area: "baby", col: "baby", cur: "tooth", cands: [], rec: "tooth" }
  };
  // Obdobia presne podľa v5-mobile.js (renderHome, MASTER, const shorts)
  const PERIODS = [
    ["Tehotenstvo do 19. týždňa", ["common", "body", "calendar"]],
    ["Tehotenstvo 20.–35. týždeň", ["common", "calendar", "prep"]],
    ["Tehotenstvo od 36. týždňa", ["questions", "calendar", "prep"]],
    ["Po pôrode 0–42 dní", ["care", "book", "calendar"]],
    ["Po pôrode 43 dní – 1 rok", ["care", "activities", "book"]],
    ["Od 1 roka", ["calendar", "book", "teeth"]]
  ];

  // Slepý test – pevné premiešané poradie (aby skupina nenapovedala)
  const BLIND = ["bookCross", "bodyHeart", "leaf", "swaddle", "bagHeart", "blocks", "health", "infoCircle", "calendar", "doctorQ",
    "teddy", "book", "mirror", "rattle", "checklist", "bulb", "bookBaby", "mama", "bagCheck", "activity", "hands", "bubbleLeaf",
    "question", "bookHeart", "clipHeart", "tooth", "bubbleQ"];
  const LABEL = {
    leaf: "list (Phosphor Leaf)", mama: "lotos (= záložka Mama v lište)", calendar: "kalendár", question: "otáznik v kruhu", checklist: "zoznam s fajkami",
    health: "ruka so srdcom (Phosphor HandHeart)", book: "otvorená kniha", activity: "postava s rozpaženými rukami", tooth: "zub", doctorQ: "zaoblený krížik s otáznikom (kruh 3.4)",
    infoCircle: "„i“ v kruhu", bulb: "žiarovka (linková)", bubbleLeaf: "bublina s lístkom", bodyHeart: "postava so srdcom na brušku", mirror: "zrkadlo",
    bagHeart: "pôrodná taška so srdcom", bagCheck: "pôrodná taška s fajkou", clipHeart: "podložka so srdcom", swaddle: "zavinuté bábätko", hands: "dlane okolo hlavičky",
    teddy: "medvedík", bookCross: "knižka s krížikom", bookBaby: "knižka s bábätkom", bookHeart: "knižka so srdcom", blocks: "kocky", rattle: "hrkálka", bubbleQ: "bublina s otáznikom"
  };
  const owner = key => Object.values(S).find(s => s.cur === key || s.cands.includes(key) || s.rec === key);

  document.getElementById("blind").innerHTML = BLIND.map((k, i) => "<div class='bt'><span class='ic'>" + svg(k) + "</span><b>" + (i + 1) + "</b></div>").join("");
  document.querySelector("#legend tbody").innerHTML = BLIND.map((k, i) => {
    const s = owner(k);
    const isCur = s.cur === k;
    const isRec = s.rec === k;
    return "<tr><td>" + (i + 1) + "</td><td>" + svg(k) + "</td><td>" + s.name + "</td><td>" + LABEL[k] + "</td><td>" +
      (isCur && isRec ? "<span class='rec'>dnes · ponechať</span>" : isCur ? "dnes v appke" : isRec ? "<span class='rec'>odporúčam</span>" : "kandidát") + "</td></tr>";
  }).join("");

  let set = "navrh", col = "dnes";
  const phone = (w, night) => "<div><p class='cap'>" + w + " px · " + (night ? "noc" : "deň") + "</p><div class='phone w" + w + (night ? " night" : "") + "'>" +
    PERIODS.map(([title, keys]) => "<p class='per'>" + title + "</p><div class='shorts'>" + keys.map(k => {
      const s = S[k];
      const c = col === "oblast" ? s.area : s.col;
      return "<button type='button' class='short tip c-" + c + "' aria-label='" + s.name + "'><span class='ic'>" + svg(set === "navrh" ? s.rec : s.cur) + "</span></button>";
    }).join("") + "</div>").join("") + "</div></div>";
  const render = () => {
    document.getElementById("stage").innerHTML = phone(390, false) + phone(390, true) + phone(320, false) + phone(320, true);
  };
  document.querySelectorAll("[data-set]").forEach(b => b.addEventListener("click", () => { set = b.dataset.set; document.querySelectorAll("[data-set]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render(); }));
  document.querySelectorAll("[data-col]").forEach(b => b.addEventListener("click", () => { col = b.dataset.col; document.querySelectorAll("[data-col]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render(); }));
  render();
})();
</script>
</body>
</html>

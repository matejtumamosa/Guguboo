<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp – kruh ako tracker</title>
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
  /* Prototyp (Samo 24. 11.): pôvodný kruh (tvar 2.9), obsah podľa obdobia.
     Po pôrode tracker: Kŕmenie · Spánok · Plienky (+ voliteľne Odsávanie, Na brušku). Pred pôrodom: Pohyby · Pitie · Vitamíny · Otázka (od 36. t. Kontrakcie). */
  :root {
    --ink: #29243a; --muted: #5d5768; --brand: #5f4fb1; --line: rgba(117, 96, 181, .14);
    --page: #f3effa; --phone: #fbf8ff; --card: #ffffff; --ph: #efe9f8; --sheet: #ffffff; --core: #ffffff;
    --sep: #ffffff; --shadow: 0 10px 30px rgba(80, 60, 140, .10), 0 2px 6px rgba(80, 60, 140, .06);
  }
  .night {
    --ink: #f3effc; --muted: #c9c1dc; --brand: #cbbcff; --line: rgba(200, 185, 255, .14);
    --phone: #1f1a2e; --card: #2a2340; --ph: #2f2846; --sheet: #2d2644; --core: #332b4c; --sep: #2a2340;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: #29243a; font-family: Montserrat, "Segoe UI", system-ui, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; background: rgba(255, 255, 255, .95); border-bottom: 1px solid rgba(117, 96, 181, .12); }
  .bar strong { font-weight: 800; margin-right: 6px; }
  .grp { display: inline-flex; flex-wrap: wrap; background: #efe9f8; border-radius: 18px; padding: 3px; }
  .grp button { border: 0; background: transparent; font: 700 13px Montserrat, system-ui, sans-serif; color: #5d5768; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .grp button[aria-pressed="true"] { background: #fff; color: #5f4fb1; box-shadow: 0 1px 4px rgba(80, 60, 140, .15); }
  .grp button:disabled { opacity: .4; cursor: default; }
  .note { flex-basis: 100%; margin: 2px 0 0; font-size: 13px; color: #5d5768; }
  #stage { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; padding: 22px 16px 60px; }
  .cap { text-align: center; font: 700 12px Montserrat, system-ui, sans-serif; color: #8a83a0; margin: 0 0 6px; }

  .phone { position: relative; overflow: hidden; border-radius: 34px; background: var(--phone); box-shadow: 0 20px 50px rgba(60, 40, 120, .18); display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 0; color: var(--ink); }
  .ph { background: var(--ph); border-radius: 18px; flex: none; display: grid; place-items: center; font: 700 11px Montserrat, system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: rgba(130, 115, 170, .55); }
  .ph-head { height: 56px; } .ph-search { height: 44px; border-radius: 22px; } .ph-hero { height: 76px; } .ph-row { height: 88px; } .ph-dnes { height: 56px; } .ph-nav { height: 72px; margin: 0 -14px; border-radius: 22px 22px 0 0; }
  .s667 .ph-head { height: 50px; } .s667 .ph-hero { height: 64px; } .s667 .ph-row { height: 76px; } .s667 .ph-dnes { height: 50px; } .s667 .ph-nav { height: 64px; }

  .card { flex: 1 1 0; min-height: 0; background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); container-type: size; position: relative; display: grid; place-items: center; }
  .ring { position: relative; width: min(94cqh, 92cqw, 310px); aspect-ratio: 1; }
  .ring svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .seg { cursor: pointer; transition: filter .2s, transform .2s; transform-origin: 210px 210px; outline: none; }
  .seg:active { transform: scale(.985); }
  .seg:focus-visible path.fill { stroke: var(--brand); stroke-width: 4; }
  .seg path.fill { stroke: var(--sep); stroke-width: 5; stroke-linejoin: round; }
  .seg.on path.fill { filter: drop-shadow(0 0 10px rgba(255, 210, 120, .6)); }
  .night .seg path.fill { opacity: .82; }
  .lbl { font: 800 20px Montserrat, system-ui, sans-serif; pointer-events: none; }
  .lbl.lg { font-size: 17px; }
  .bb { position: relative; }
  .tag2 { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font: 700 11px/1 Montserrat, system-ui, sans-serif; font-style: normal; background: var(--brand); color: #fff; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
  .night .tag2 { color: #1f1a2e; }
  .sub { font: 700 15px Montserrat, system-ui, sans-serif; pointer-events: none; }
  .night .lbl, .night .sub { fill: #1f1a2e !important; }
  .small .sub { display: none; }
  .core { position: absolute; left: 50%; top: 50%; width: 37%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 0; cursor: pointer; background: radial-gradient(circle at 35% 25%, var(--core), color-mix(in srgb, var(--core) 92%, #b9a8f0)); box-shadow: 0 8px 22px rgba(95, 79, 177, .16), inset 0 0 0 1px var(--line); color: var(--ink); display: grid; place-content: center; justify-items: center; gap: 2px; font-family: inherit; padding: 6px; transition: transform .15s; }
  .core:active { transform: translate(-50%, -50%) scale(.95); }
  .core b { font: 800 clamp(14px, 5.6cqh, 17px)/1.1 Montserrat, system-ui, sans-serif; white-space: nowrap; }
  .core u { font: 700 12px Montserrat, system-ui, sans-serif; color: var(--brand); }
  .core .cl { font: 600 12px/1 Montserrat, system-ui, sans-serif; color: var(--muted); }
  .core .tm { font: 800 clamp(18px, 8cqh, 26px)/1.05 Montserrat, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .core .st { font: 700 11px Montserrat, system-ui, sans-serif; color: #fff; background: var(--brand); padding: 3px 9px; border-radius: 999px; margin-top: 3px; }
  .night .core .st { color: #1f1a2e; }
  .core svg { width: 18px; height: 18px; color: var(--brand); }

  /* malé okno */
  .scrim { position: absolute; inset: 0; background: rgba(30, 20, 60, .3); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 5; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; max-height: 82%; overflow: auto; z-index: 6; background: var(--sheet); color: var(--ink); border-radius: 26px; padding: 16px 16px 18px; box-shadow: 0 -10px 40px rgba(40, 20, 90, .25); transform: translateY(115%); transition: transform .32s cubic-bezier(.2, .9, .3, 1.05); }
  .sheet.open { transform: none; }
  .sh-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sh-h .o { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--tb, #efe9f8); color: var(--ti, #5f4fb1); }
  .sh-h .o svg { width: 22px; height: 22px; }
  .sh-h h3 { margin: 0; font: 800 18px Montserrat, system-ui, sans-serif; flex: 1; }
  .x { border: 0; background: var(--ph); color: var(--ink); width: 36px; height: 36px; border-radius: 50%; font: 700 18px Montserrat, system-ui, sans-serif; cursor: pointer; }
  .last { margin: -4px 0 12px; font: 600 14px Montserrat, system-ui, sans-serif; color: var(--muted); }
  .seg-tabs { display: flex; background: var(--ph); border-radius: 14px; padding: 3px; margin-bottom: 12px; }
  .seg-tabs button { flex: 1; border: 0; background: none; padding: 9px; border-radius: 11px; font: 700 14px Montserrat, system-ui, sans-serif; color: var(--muted); cursor: pointer; }
  .seg-tabs button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(80, 60, 140, .15); }
  .big2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .bb { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 18px; padding: 14px 8px; font: 800 16px Montserrat, system-ui, sans-serif; cursor: pointer; display: grid; justify-items: center; gap: 4px; }
  .bb small { font: 600 12px Montserrat, system-ui, sans-serif; color: var(--muted); }
  .bb.hint { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
  .bb:active { transform: scale(.97); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 700 14px Montserrat, system-ui, sans-serif; padding: 10px 13px; border-radius: 999px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: transparent; }
  .night .chip[aria-pressed="true"], .night .save { color: #1f1a2e; }
  .lab { font: 700 13px Montserrat, system-ui, sans-serif; color: var(--muted); margin: 4px 0 8px; }
  .save { width: 100%; border: 0; background: var(--brand); color: #fff; font: 800 16px Montserrat, system-ui, sans-serif; padding: 14px; border-radius: 16px; cursor: pointer; }
  .link { display: block; width: 100%; border: 0; background: none; color: var(--brand); font: 700 14px Montserrat, system-ui, sans-serif; padding: 12px 0 0; cursor: pointer; }
  textarea { width: 100%; min-height: 84px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 600 15px Montserrat, system-ui, sans-serif; padding: 12px; margin-bottom: 10px; resize: none; }
  .count { text-align: center; font: 800 44px/1 Montserrat, system-ui, sans-serif; margin: 4px 0 2px; }
  .count + p { text-align: center; margin: 0 0 12px; color: var(--muted); font: 600 14px Montserrat, system-ui, sans-serif; }
  /* Náš deň */
  .sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .sum div { background: var(--ph); border-radius: 14px; padding: 10px 6px; text-align: center; }
  .sum b { display: block; font: 800 20px Montserrat, system-ui, sans-serif; }
  .sum span { font: 600 12px Montserrat, system-ui, sans-serif; color: var(--muted); }
  .list { list-style: none; margin: 0 0 6px; padding: 0; }
  .list li { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); font: 600 14px Montserrat, system-ui, sans-serif; }
  .list time { font-weight: 800; font-variant-numeric: tabular-nums; }
  .list .ed { border: 0; background: var(--ph); color: var(--ink); border-radius: 999px; padding: 6px 10px; font: 700 12px Montserrat, system-ui, sans-serif; cursor: pointer; }
  .edrow { display: flex; gap: 8px; justify-content: center; margin: 6px 0 12px; }
  .edrow button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 9px 12px; font: 700 14px Montserrat, system-ui, sans-serif; cursor: pointer; }
  .edtime { text-align: center; font: 800 34px Montserrat, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .del { color: #a24766 !important; }
  .toast { position: absolute; left: 50%; bottom: 86px; z-index: 7; transform: translate(-50%, 20px); opacity: 0; transition: .25s; background: #29243a; color: #fff; font: 700 14px Montserrat, system-ui, sans-serif; padding: 10px 10px 10px 16px; border-radius: 999px; display: flex; gap: 12px; align-items: center; white-space: nowrap; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { border: 0; background: rgba(255, 255, 255, .16); color: #fff; font: 700 13px Montserrat, system-ui, sans-serif; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

</div>

    }
    if (k === "move") { const d = today(k).sort((a, b) => b.t - a.t); return head(k, "Pohyby") + (d.length ? "<p class='last'>Dnes " + d.map(x => hm(x.t)).join(", ") + "</p>" : "") + "<div class='big2' style='grid-template-columns:1fr'><button class='bb' data-do='move'>Cítim pohyby<small>zapíše sa čas</small></button></div>"; }
    if (k === "drink") { const n = today(k).length; return head(k, "Pitie") + "<div class='count'>" + n + "</div><p>" + (n === 1 ? "pohár" : n > 1 && n < 5 ? "poháre" : "pohárov") + " dnes</p><div class='big2' style='grid-template-columns:1fr'><button class='bb' data-do='drink'>+1 pohár</button></div>" + (n ? "<button class='link' data-do='drink-minus'>Odobrať jeden</button>" : ""); }
    if (k === "vit") return head(k, "Vitamíny") + (today(k).length ? "<p class='last'>Dnes už máš ✓ (" + hm(today(k)[0].t) + ")</p><button class='link' data-do='vit-undo'>Zrušiť dnešný záznam</button>" : "<div class='big2' style='grid-template-columns:1fr'><button class='bb' data-do='vit'>Vzala som si ich<small>dnes</small></button></div>");
    if (k === "question") { const open = REC.filter(x => x.k === "question" && !x.done); return head(k, "Otázka pre lekára") + "<textarea placeholder='Napíš jednu vetu…' aria-label='Otázka pre lekára'></textarea><button class='save' data-do='question'>Uložiť</button>" + (open.length ? "<p class='lab' style='margin-top:14px'>Na kontrolu</p><ul class='list'>" + open.map(x => "<li><time>" + new Date(x.t).toLocaleDateString("sk-SK", { day: "numeric", month: "numeric" }) + "</time><span>" + x.text + "</span><span></span></li>").join("") + "</ul>" : ""); }
    if (k === "contraction") {
      const d = today(k).sort((a, b) => b.t - a.t);
      const lst = d.length ? "<p class='lab'>Dnes</p><ul class='list'>" + d.slice(0, 4).map((x, i) => "<li><time>" + hm(x.t) + "</time><span>" + x.dur + " s</span><span>" + (d[i + 1] ? "odstup " + span(x.t - d[i + 1].t) : "") + "</span></li>").join("") + "</ul>" : "";
      if (RUN.contraction) return head(k, "Kontrakcie") + "<div class='big2' style='grid-template-columns:1fr'><button class='bb' data-do='con-stop'>Skončila<small>uloží sa dĺžka</small></button></div>" + lst;
      return head(k, "Kontrakcie") + "<div class='big2' style='grid-template-columns:1fr'><button class='bb' data-do='con-start'>Začala teraz<small>spustí čas</small></button></div>" + lst;
    }
    return "";
  }
  function dayBody() {
    const po = S.period === "po", d = REC.filter(r => isToday(r.t) && segsNow().includes(r.k)).sort((a, b) => b.t - a.t);
    const sleepMin = today("sleep").reduce((s, r) => s + ((r.end || now()) - r.t) / MIN, 0);
    const tiles = po ? [[today("feed").length, "kŕmení"], [span(sleepMin * MIN), "spánku"], [today("diaper").length, "plienok"]]
      : [[today("move").length, "pohyby"], [S.period === "w36" ? today("contraction").length : today("drink").length, S.period === "w36" ? "kontrakcie" : "poháre"], [today("vit").length ? "✓" : "–", "vitamíny"]];
    const desc = r => r.k === "feed" ? (r.side ? r.side + " prsník" + (r.dur ? " · " + r.dur + " min" : "") : "Fľaša · " + r.ml + " ml") : r.k === "sleep" ? "Spánok · " + span((r.end || now()) - r.t) : r.k === "diaper" ? r.kind : r.k === "pump" ? "Odsávanie · " + r.ml + " ml" : r.k === "tummy" ? "Na brušku · " + r.dur + " min" : r.k === "contraction" ? "Kontrakcia · " + r.dur + " s" : r.k === "question" ? "Otázka" : SEG[r.k].l;
    return head(po ? "sleep" : "move", S.night ? "Naša noc" : "Náš deň") + "<div class='sum'>" + tiles.map(t => "<div><b>" + t[0] + "</b><span>" + t[1] + "</span></div>").join("") + "</div>" +
      (d.length ? "<ul class='list'>" + d.map(r => "<li><time>" + hm(r.t) + "</time><span>" + desc(r) + "</span><button class='ed' data-sheet='edit' data-arg='" + REC.indexOf(r) + "'>Upraviť</button></li>").join("") + "</ul>" : "<p class='last'>Dnes zatiaľ nič.</p>") +
      (po ? "<button class='link' data-do='share'>Poslať prehľad blízkemu ›</button>" : "");
  }
  function editBody(i) {
    const r = REC[+i]; if (!r) return "";
    return head(r.k, "Upraviť – " + SEG[r.k].l) + "<div class='edtime' data-edt='" + r.t + "'>" + hm(r.t) + "</div><div class='edrow'><button data-shift='-15'>−15</button><button data-shift='-5'>−5</button><button data-shift='5'>+5</button><button data-shift='15'>+15</button></div>" +
      "<button class='save' data-do='edit-save' data-arg='" + i + "'>Uložiť čas</button><button class='link del' data-do='edit-del' data-arg='" + i + "'>Zmazať záznam</button>";
  }
  function openSheet(ph, k, arg, quiet) {
    const sh = ph.querySelector(".sheet"), sc = ph.querySelector(".scrim");
    sh.innerHTML = sheetBody(k, arg); ph._sheet = { k, arg };
    if (quiet) { sh.style.transition = "none"; requestAnimationFrame(() => { sh.style.transition = ""; }); }
    sh.classList.add("open"); sc.classList.add("open");
  }
  function closeSheet(ph) { ph._sheet = null; ph.querySelector(".sheet").classList.remove("open"); ph.querySelector(".scrim").classList.remove("open"); }

  // ——— Akcie ———
  function act(ph, d, el) {
    const sh = ph.querySelector(".sheet"), snap = snapshot(), t = now(), done = msg => { closeSheet(ph); stage.querySelectorAll(".phone").forEach(p => { p._sheet = null; }); commit(ph, msg, snap); };
    switch (d) {
      case "feed-start": RUN.feed = { t, side: el.dataset.side }; return done("Kŕmenie beží");
      case "feed-switch": { const f = RUN.feed; REC.push({ k: "feed", t: f.t, side: f.side, dur: Math.max(1, Math.round((t - f.t) / MIN)) }); RUN.feed = { t, side: f.side === "Ľavý" ? "Pravý" : "Ľavý" }; return done("Prepnuté na " + RUN.feed.side.toLowerCase()); }
      case "feed-stop": { const f = RUN.feed; REC.push({ k: "feed", t: f.t, side: f.side, dur: Math.max(1, Math.round((t - f.t) / MIN)) }); delete RUN.feed; return done("Uložené"); }
      case "feed-bottle": REC.push({ k: "feed", t, bottle: pressed(sh, "milk"), ml: +pressed(sh, "ml") }); return done("Uložené");
      case "feed-backsave": REC.push({ k: "feed", t: t - (+pressed(sh, "ago")) * MIN, side: pressed(sh, "side"), dur: +pressed(sh, "dur") }); return done("Uložené");
      case "sleep-start": RUN.sleep = { t: t - (+el.dataset.ago) * MIN }; return done("Spánok beží");
      case "sleep-stop": REC.push({ k: "sleep", t: RUN.sleep.t, end: t }); delete RUN.sleep; return done("Uložené · spalo " + span(t - snap.run.sleep.t));
      case "diaper": REC.push({ k: "diaper", t, kind: el.dataset.v }); return done("Uložené");
      case "pump": REC.push({ k: "pump", t, side: pressed(sh, "side"), ml: +pressed(sh, "ml") }); return done("Uložené");
      case "tummy-start": RUN.tummy = { t }; return done("Na brušku beží");
      case "tummy-stop": REC.push({ k: "tummy", t: RUN.tummy.t, dur: Math.max(1, Math.round((t - RUN.tummy.t) / MIN)) }); delete RUN.tummy; return done("Uložené");
      case "move": REC.push({ k: "move", t }); return done("Uložené");
      case "drink": REC.push({ k: "drink", t }); return done("Uložené · " + today("drink").length + ". pohár");
      case "drink-minus": { const x = today("drink").sort((a, b) => b.t - a.t)[0]; REC.splice(REC.indexOf(x), 1); return done("Odobraté"); }
      case "vit": REC.push({ k: "vit", t }); return done("Uložené");
      case "vit-undo": REC = REC.filter(x => !(x.k === "vit" && isToday(x.t))); return done("Zrušené");
      case "question": { const v = sh.querySelector("textarea").value.trim(); if (!v) { sh.querySelector("textarea").focus(); return; } REC.push({ k: "question", t, text: v }); return done("Otázka je uložená"); }
      case "con-start": RUN.contraction = { t }; return done("Kontrakcia beží");
      case "con-stop": REC.push({ k: "contraction", t: RUN.contraction.t, dur: Math.max(1, Math.round((t - RUN.contraction.t) / 1000)) }); delete RUN.contraction; return done("Uložené");
      case "edit-save": REC[+el.dataset.arg].t = +sh.querySelector("[data-edt]").dataset.edt; return done("Čas je upravený");
      case "edit-del": REC.splice(+el.dataset.arg, 1); return done("Zmazané");
      case "share": return done("[ukážka] Otvorí sa zdieľanie telefónu");
    }
  }
  const STOP = { sleep: "sleep-stop", feed: "feed-stop", tummy: "tummy-stop", contraction: "con-stop" };
  stage.addEventListener("click", e => {
    const ph = e.target.closest(".phone"); if (!ph) return;
    if (e.target.closest(".scrim, [data-close]")) return closeSheet(ph);
    const ch = e.target.closest(".chip[data-g]");
    if (ch) { ch.parentNode.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === ch))); return; }
    const tab = e.target.closest("[data-tab]"); if (tab) return openSheet(ph, "feed", tab.dataset.tab, true);
    const sf = e.target.closest("[data-shift]");
    if (sf) { const el = ph.querySelector("[data-edt]"), v = Math.min(now(), +el.dataset.edt + +sf.dataset.shift * MIN); el.dataset.edt = v; el.textContent = hm(v); return; }
    const sw = e.target.closest("[data-sheet]"); if (sw) return openSheet(ph, sw.dataset.sheet, sw.dataset.arg, true);
    const d = e.target.closest("[data-do]"); if (d) return act(ph, d.dataset.do, d);
    const core = e.target.closest(".core");
    if (core) return core.dataset.act === "stop" ? act(ph, STOP[core.dataset.k], core) : openSheet(ph, "day");
    const seg = e.target.closest(".seg"); if (seg) return openSheet(ph, seg.dataset.k);
  });
  stage.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".seg")) { e.preventDefault(); openSheet(e.target.closest(".phone"), e.target.dataset.k); }
    if (e.key === "Escape") stage.querySelectorAll(".phone").forEach(closeSheet);
  });

  function sync() {
    document.querySelectorAll("#bar button").forEach(b => {
      const k = b.dataset.k, v = b.dataset.v;
      if (k === "pump" || k === "tummy") { b.disabled = S.period !== "po"; b.setAttribute("aria-pressed", String(S[k])); return; }
      b.setAttribute("aria-pressed", String(k === "period" ? S.period === v : k === "night" ? String(+S.night) === v : S.size === v));
    });
    const q = new URLSearchParams({ period: S.period }); if (S.night) q.set("night", 1); if (S.size !== "390") q.set("size", S.size); if (S.pump) q.set("pump", 1); if (S.tummy) q.set("tummy", 1);
    try { history.replaceState(null, "", "?" + q); } catch (err) { /* súbor */ }
  }
  document.getElementById("bar").addEventListener("click", e => {
    const b = e.target.closest("button[data-k]"); if (!b || b.disabled) return;
    const k = b.dataset.k, v = b.dataset.v;
    if (k === "period") S.period = v; if (k === "night") S.night = v === "1"; if (k === "size") S.size = v;
    if (k === "pump" || k === "tummy") S[k] = !S[k];
    sync(); render();
  });
  sync(); render();
})();
</script>
</body>
</html>

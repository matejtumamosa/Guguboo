<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp – Kruh cesty</title>
<!-- Prototyp „Kruh cesty“ – 2. verzia, radikálne zjednodušená (Samo 17. 11. 2026: hodiny dňa „chaotické“ → preč).
     Samostatný súbor, appka naň neodkazuje.
     Tri vrstvy: tichá linka času (otáčanie prstom, náhľad v strede) · pôvodný kruh z appky
     (pred pôrodom 3 diely prípravy Domov · Taška · Vybaviť, ktoré dorastajú; po pôrode Kŕmenie · Spánok · Plienky)
     · stred = dnešok / časovač, ťuk = 3 rýchle záznamy.
     Ikony = iconPaths vo v5-mobile.js; ovocie = baby-figure.js; veľkosti = content/pregnancy-weeks.js (+ APPROX_ROUND
     z guguchat.js); vety o mesiacoch = content/baby-months.js. Najviac 3 farby (ružová, broskyňová, modrá). -->
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
  :root { --brand: #5f4fb1; --ic: #6a4fc4; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Montserrat, "Segoe UI", system-ui, sans-serif; background: #ece7f4; color: #29243a; }
  button { font-family: inherit; }

  /* ——— Prepínače (len pre prototyp) ——— */
  .bar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px;
    background: rgba(255, 255, 255, .94); border-bottom: 1px solid rgba(117, 96, 181, .14); backdrop-filter: blur(8px); }
  .bar strong { font-size: 14px; font-weight: 800; margin-right: 4px; }
  .grp { display: inline-flex; padding: 3px; border-radius: 999px; background: #f1ecfa; }
  .grp button { min-height: 38px; padding: 0 13px; border: 0; border-radius: 999px; background: transparent; color: #5d5768; font-size: 13px; font-weight: 700; cursor: pointer; }
  .grp button[aria-pressed="true"] { background: #fff; color: var(--brand); box-shadow: 0 2px 8px rgba(84, 57, 101, .12); }
  .grp button:disabled { opacity: .45; cursor: not-allowed; }
  .bar small { flex-basis: 100%; color: #5d5768; font-size: 12px; font-weight: 600; }

  .stage { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 34px; padding: 26px 12px 48px; }
  .cap { margin: 0 0 10px; text-align: center; color: #6f6880; font-size: 12px; font-weight: 700; }

  /* ——— Telefón + sivé zástupné bloky domova ——— */
  .phone { --ink: #29243a; --muted: #5d5768; --card: rgba(255, 253, 255, .97); --card-solid: #fff; --line: rgba(117, 96, 181, .14);
    --ph: rgba(117, 96, 181, .075); --sep: #fffdff; --gap: 14px;
    --track: #e7e1f3; --done: #c9bdea; --dot: #7b6bc8;
    position: relative; display: flex; flex-direction: column; gap: var(--gap); padding: 16px 16px 0; overflow: hidden; border-radius: 34px;
    color: var(--ink); background: linear-gradient(165deg, #f4f0ff 0%, #fbf8ff 48%, #fff4f0 100%);
    box-shadow: 0 30px 60px rgba(60, 40, 90, .18), 0 0 0 8px #fff, 0 0 0 9px rgba(117, 96, 181, .2); }
  .phone.night { --ink: #f1ecfa; --muted: #c2b9d6; --card: #262036; --card-solid: #2b2440; --line: rgba(190, 170, 255, .16);
    --ph: rgba(255, 255, 255, .06); --sep: #262036; --track: #3a3350; --done: #5f548a; --dot: #b9adf0;
    background: linear-gradient(165deg, #1d1829 0%, #211b30 55%, #261d2c 100%); box-shadow: 0 30px 60px rgba(20, 10, 40, .4), 0 0 0 8px #3a3350, 0 0 0 9px rgba(0, 0, 0, .3); }
  .phone.s667 { --gap: 10px; padding-top: 12px; }
  .ph { flex: none; border-radius: 20px; background: var(--ph); }
  .ph-head { display: flex; gap: 10px; background: none; }
  .ph-head i { display: block; border-radius: 20px; background: var(--ph); }
  .ph-head i:first-child { flex: 1; }
  .ph-head i:not(:first-child) { width: 52px; border-radius: 50%; }
  .ph-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: none; }
  .ph-row i { border-radius: 20px; background: var(--ph); }
  .ph-nav { margin: auto -16px 0; border-radius: 26px 26px 0 0; background: var(--ph); }
  .phone.s844 .ph-head { height: 66px; } .phone.s844 .ph-search { height: 54px; } .phone.s844 .ph-hero { height: 82px; }
  .phone.s844 .ph-row { height: 92px; } .phone.s844 .ph-dnes { height: 64px; } .phone.s844 .ph-nav { height: 84px; }
  .phone.s667 .ph-head { height: 54px; } .phone.s667 .ph-search { height: 46px; } .phone.s667 .ph-hero { height: 76px; }
  .phone.s667 .ph-row { height: 76px; } .phone.s667 .ph-dnes { height: 54px; } .phone.s667 .ph-nav { height: 72px; }

  .ringcard { position: relative; flex: 1 1 auto; min-height: 0; display: grid; place-items: center; border-radius: 24px;
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 12px 34px rgba(84, 57, 101, .07); }

  /* ——— Kruh cesty ——— */
  .ring { position: relative; width: var(--S); height: var(--S); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .dial { position: absolute; inset: -4px; border-radius: 50%; pointer-events: none; outline: none; }
  .dial:focus-visible { box-shadow: 0 0 0 3px rgba(123, 97, 200, .55); }

  .mid { transform-box: view-box; transform-origin: 210px 210px; transition: opacity .3s ease, transform .5s cubic-bezier(.3, 1.4, .5, 1); }
  .ring.open .mid { opacity: .25; transform: scale(.95); }
  .ring.pv .mid { opacity: .35; transform: scale(.97); }
  .seg-base { stroke: var(--sep); stroke-width: 5; stroke-linejoin: round; }
  .seg-hit { fill: transparent; stroke: none; cursor: pointer; outline: none; }
  .seg-hit:focus-visible { stroke: rgba(111, 84, 158, .75); stroke-width: 4; }
  .seg-fill { transition: opacity .4s ease; }
  .sic { pointer-events: none; }
  .last { font: 700 15px Montserrat, "Segoe UI", system-ui, sans-serif; text-anchor: middle; pointer-events: none; }
  .seg-pulse { transform-box: fill-box; transform-origin: center; animation: segPulse .9s ease; }
  @keyframes segPulse { 40% { transform: scale(1.04); filter: brightness(1.06); } }

  /* Linka času: jedna farba, prejdené o tón tmavšie, jedna bodka = dnes */
  .track { fill: none; stroke: var(--track); }
  .done { fill: none; stroke: var(--done); stroke-linecap: round; }
  .today { fill: var(--dot); stroke: var(--sep); stroke-width: 2.5; pointer-events: none; }

  /* Stred = dnešok */
  .core { position: absolute; left: 50%; top: 50%; width: var(--C); height: var(--C); margin: calc(var(--C) / -2) 0 0 calc(var(--C) / -2);
    display: grid; place-content: center; justify-items: center; gap: 2px; padding: 0; border: 0; border-radius: 50%; text-align: center; color: var(--ink); cursor: pointer;
    background: radial-gradient(circle at 38% 28%, #fff 0%, #fcfaff 52%, #f1ebfb 100%);
    box-shadow: 0 10px 22px rgba(84, 57, 101, .14), inset 0 -6px 14px rgba(123, 97, 200, .07), inset 0 2px 0 #fff;
    transition: transform .45s cubic-bezier(.34, 1.56, .64, 1), opacity .2s ease; z-index: 2; }
  .night .core { background: radial-gradient(circle at 38% 28%, #3d3456 0%, #322a49 55%, #2a2340 100%);
    box-shadow: 0 10px 22px rgba(0, 0, 0, .35), inset 0 -6px 14px rgba(0, 0, 0, .15), inset 0 1px 0 rgba(255, 255, 255, .08); }
  .core:focus-visible { outline: 3px solid rgba(123, 97, 200, .6); outline-offset: 4px; }
  .core .l1 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
  .core .l2 { font-size: 14px; font-weight: 600; line-height: 1.2; color: var(--muted); }
  .core .hint { display: grid; place-items: center; width: 22px; height: 22px; margin-top: 5px; border-radius: 50%; background: rgba(123, 97, 200, .12); color: var(--ic); }
  .night .core .hint { background: rgba(200, 185, 255, .16); color: #d9cfff; }
  .core .hint svg { width: 12px; height: 12px; }
  .core .tm { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1.05; }
  .core .tic { width: 18px; height: 18px; color: #768fd8; }
  .core .xx { width: 22px; height: 22px; color: var(--muted); }
  .ring.open .core { transform: scale(.6); }
  .ring.small.open .core { transform: scale(.5); }
  .ring.pv .core { opacity: 0; }
  .ring.small .core .l2 { display: none; }
  .ring.small .core.run .l2 { display: block; }
  .ring.small .core .l1 { font-size: 15px; }
  .ring.small .core .tm { font-size: 18px; }

  /* Náhľad pri otáčaní */
  .preview { position: absolute; left: 50%; top: 50%; width: var(--PV); height: var(--PV); margin: calc(var(--PV) / -2) 0 0 calc(var(--PV) / -2);
    display: grid; place-content: center; justify-items: center; padding: 0 11%; border-radius: 50%; text-align: center; pointer-events: none;
    background: radial-gradient(circle at 40% 28%, #fff 0%, #f8f4ff 55%, #fff3ee 100%);
    box-shadow: 0 18px 38px rgba(84, 57, 101, .18), inset 0 2px 0 #fff; opacity: 0; transform: scale(.5);
    transition: transform .5s cubic-bezier(.3, 1.45, .5, 1), opacity .22s ease; z-index: 3; }
  .night .preview { background: radial-gradient(circle at 40% 28%, #3f355a 0%, #30284a 60%, #2c2238 100%); box-shadow: 0 18px 38px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .08); }
  .ring.pv .preview { opacity: 1; transform: none; }
  .ring.post .preview { padding: 0 12%; }
  .pv-in { display: grid; justify-items: center; gap: 3px; }
  .pv-in.swap { animation: swap .28s ease; }
  @keyframes swap { from { opacity: .35; transform: translateY(4px); } }
  .pv-art svg { display: block; width: 44px; height: 44px; }
  .pv-l1 { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
  .pv-l2 { font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--muted); }
  .ring.small .pv-art svg { width: 34px; height: 34px; }
  .ring.small .pv-l1 { font-size: 16px; }
  .ring.small .pv-l2 { font-size: 13px; }

  /* Rýchle záznamy – vykvitnú zo stredu */
  .petal { position: absolute; left: 50%; top: 50%; width: var(--P); height: var(--P); margin: calc(var(--P) / -2) 0 0 calc(var(--P) / -2);
    display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; color: var(--pi); cursor: pointer; z-index: 4;
    background: radial-gradient(circle at 34% 28%, #fff 0%, var(--pc) 75%);
    box-shadow: 0 12px 22px rgba(84, 57, 101, .2), inset 0 -4px 10px rgba(84, 57, 101, .06), inset 0 2px 0 #fff;
    opacity: 0; transform: translate(0, 0) scale(.2); pointer-events: none; transition: transform .25s ease, opacity .18s ease; }
  .night .petal { background: radial-gradient(circle at 34% 28%, #6a5c8e 0%, var(--pn) 85%); box-shadow: 0 12px 22px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .1); color: var(--pin); }
  .petal svg { width: 44%; height: 44%; }
  .petal b { position: absolute; top: calc(100% + 5px); left: 50%; transform: translateX(-50%); padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    background: var(--card-solid); color: var(--ink); font-size: 13px; font-weight: 700; box-shadow: 0 3px 8px rgba(84, 57, 101, .12); }
  .petal:focus-visible { outline: 3px solid rgba(123, 97, 200, .6); outline-offset: 3px; }
  .ring.open .petal { opacity: 1; pointer-events: auto; transform: translate(var(--x), var(--y)) scale(1);
    transition: transform .62s cubic-bezier(.28, 1.6, .5, 1) calc(var(--i) * 55ms), opacity .22s ease calc(var(--i) * 55ms); }

  /* Malé okno (× / ťuk vedľa / Esc) */
  .scrim { position: absolute; inset: 0; z-index: 8; background: rgba(41, 36, 58, .3); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 9; padding: 16px 16px 18px; border-radius: 26px; background: var(--card-solid);
    box-shadow: 0 -10px 40px rgba(41, 36, 58, .2); transform: translateY(calc(100% + 20px)); visibility: hidden;
    transition: transform .42s cubic-bezier(.2, .9, .25, 1.04), visibility 0s linear .42s; }
  .sheet.open { transform: none; visibility: visible; transition: transform .42s cubic-bezier(.2, .9, .25, 1.04); }
  .sh-head { display: flex; align-items: center; gap: 12px; }
  .sh-ic { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 14px; background: rgba(123, 97, 200, .12); color: var(--ic); }
  .night .sh-ic { background: rgba(200, 185, 255, .14); color: #d9cfff; }
  .sh-ic svg { width: 24px; height: 24px; }
  .sh-head h3 { flex: 1; margin: 0; font-size: 18px; font-weight: 800; }
  .x { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(117, 96, 181, .09); color: var(--ink); cursor: pointer; }
  .x svg { width: 18px; height: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .chip { min-height: 46px; padding: 0 16px; border: 1.5px solid rgba(117, 96, 181, .22); border-radius: 16px; background: transparent; color: var(--ink); font-size: 15px; font-weight: 700; cursor: pointer; }
  .chip:focus-visible, .save:focus-visible, .x:focus-visible, .toast button:focus-visible { outline: 3px solid rgba(123, 97, 200, .6); outline-offset: 2px; }
  .chip[aria-pressed="true"] { border-color: #7b6bc8; background: #f3eeff; color: #4a3d99; }
  .night .chip[aria-pressed="true"] { background: #3d3360; color: #f1ecfa; border-color: #a99be0; }
  .sh-note { margin: 12px 0 16px; color: var(--muted); font-size: 14px; font-weight: 600; line-height: 1.4; }
  .save { width: 100%; min-height: 52px; border: 0; border-radius: 18px; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer;
    background: linear-gradient(135deg, #8171ce, #5f4fb1); box-shadow: 0 8px 18px rgba(95, 79, 177, .28); }
  .tag { color: #9a8fb0; font-size: 12px; font-weight: 700; }

  .toast { position: absolute; left: 50%; bottom: 96px; z-index: 7; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 18px; border-radius: 999px; white-space: nowrap;
    background: #2f2944; color: #fff; font-size: 14px; font-weight: 700; box-shadow: 0 10px 24px rgba(41, 36, 58, .28);
    opacity: 0; transform: translate(-50%, 16px); pointer-events: none; transition: opacity .25s ease, transform .35s cubic-bezier(.3, 1.4, .5, 1); }
  .phone.s667 .toast { bottom: 82px; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .16); color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; }
  .night .toast { background: #f1ecfa; color: #29243a; }
  .night .toast button { background: rgba(95, 79, 177, .14); color: #4a3d99; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @keyframes midIn { from { opacity: 0; transform: scale(.9); } }
  .ring.intro .mid { animation: midIn .8s cubic-bezier(.3, 1.3, .5, 1) both; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  .core .hint.day { width: auto; height: auto; padding: 3px 10px; border-radius: 999px; font: 700 12px/16px Montserrat, "Segoe UI", system-ui, sans-serif; }
  .day-list { list-style: none; margin: 4px 0 10px; padding: 0; display: grid; gap: 8px; }
  .day-list li { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 10px; font: 600 15px/20px Montserrat, "Segoe UI", system-ui, sans-serif; }
  .day-list li > span:last-child { color: #5d5768; font-size: 14px; }
  .night .day-list li > span:last-child { color: #c9c1dc; }
  .day-list .sh-ic svg { width: 20px; height: 20px; }
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Nastavenie prototypu">
  <strong>Kruh cesty</strong>
  <span class="grp"><button type="button" data-k="period" data-v="pred">Pred pôrodom</button><button type="button" data-k="period" data-v="po">Po pôrode</button></span>
  <span class="grp"><button type="button" data-k="night" data-v="0">Deň</button><button type="button" data-k="night" data-v="1">Noc</button></span>
  <span class="grp"><button type="button" data-k="run" data-v="t" id="runBtn">Beží časovač</button></span>
  <span class="grp"><button type="button" data-k="size" data-v="390">390 × 844</button><button type="button" data-k="size" data-v="375">375 × 667</button><button type="button" data-k="size" data-v="obe">obe</button></span>
  <small>Potiahni prstom po kruhu = iný týždeň / mesiac (pustíš → späť na dnešok). Ťukni na stred = rýchle záznamy. Nič sa neukladá. Adresa: ?period=po&amp;night=1&amp;run=1&amp;size=obe</small>
</div>
<main class="stage" id="stage"></main>

        e.preventDefault(); cancelAnimationFrame(this.raf); this.hinting = false;
        this.setPos(this.unitToPos(Math.max(1, Math.min(max, u))));
        clearTimeout(this.kt); this.kt = setTimeout(() => this.springTo(today(pre)), 2800);
      });
      this.dial.addEventListener("blur", () => { clearTimeout(this.kt); this.springTo(today(this.pre)); });
    }
    startScrub(ang) {
      cancelAnimationFrame(this.raf); this.hinting = false; this.scrubbing = true; this.el.classList.add("scrub");
      this.setPos(this.rawPos(ang));
    }
    tapSeg(target) {
      const s = target.closest && target.closest("[data-seg]");
      if (!s) return;
      const i = +s.dataset.seg;
      if (this.pre) App.openSheet(this, "prep", i);
      else if (QUICK[i].k === "sleep" && S.run) App.stopTimer(this);
      else App.openSheet(this, QUICK[i].k);
    }
    openBloom(kbd) {
      this.open = true; this.el.classList.add("open"); this.renderCore();
      this.bloom.querySelectorAll(".petal").forEach(p => p.tabIndex = 0);
      if (kbd) setTimeout(() => this.bloom.querySelector(".petal")?.focus({ preventScroll: true }), reduced ? 0 : 260);
    }
    closeBloom(focusCore) {
      if (!this.open) return;
      this.open = false; this.el.classList.remove("open"); this.renderCore();
      this.bloom.querySelectorAll(".petal").forEach(p => p.tabIndex = -1);
      if (focusCore) this.core.focus({ preventScroll: true });
    }
    pulse(k) {
      const i = QUICK.findIndex(q => q.k === k); if (i < 0 || reduced) return;
      const f = this.svg.querySelector(".seg-fill[data-i='" + i + "']"); if (f) f.classList.add("seg-pulse");
    }
    tick() {
      if (this.pre || !S.run || this.open) return;
      const tm = this.core.querySelector(".tm"); if (tm) tm.textContent = fmt(elapsed());
    }
  }

  // ——— Aplikácia prototypu ———
  const stage = document.getElementById("stage");
  let rings = [];
  const phoneHtml = (w, h) => "<div><p class='cap'>" + w + " × " + h + "</p><div class='phone s" + h + (S.night ? " night" : "") + "' style='width:" + w + "px;height:" + h + "px'>" +
    "<div class='ph ph-head'><i></i><i></i><i></i></div><div class='ph ph-search'></div><div class='ph ph-hero'></div><div class='ph ph-row'><i></i><i></i><i></i></div>" +
    "<section class='ringcard' aria-label='Kruh cesty'><div class='ring'><svg class='ring-svg' viewBox='0 0 420 420' role='group' aria-label='Kruh cesty'></svg>" +
    "<div class='dial' role='slider' tabindex='0'></div><div class='preview' aria-hidden='true'><div class='pv-in'></div></div>" +
    "<button type='button' class='core'></button><div class='bloom'></div></div></section>" +
    "<div class='ph ph-dnes'></div><div class='ph ph-nav'></div>" +
    "<div class='scrim'></div><div class='sheet' role='dialog' aria-modal='true' aria-labelledby='t" + w + "'></div>" +
    "<div class='toast' role='status'></div><div class='live sr' aria-live='polite'></div></div></div>";
  function build() {
    const sizes = S.size === "obe" ? [[390, 844], [375, 667]] : S.size === "375" ? [[375, 667]] : [[390, 844]];
    stage.innerHTML = sizes.map(s => phoneHtml(s[0], s[1])).join("");
    rings = [...stage.querySelectorAll(".phone")].map(p => new Ring(p));
    rings.forEach(r => r.fit());
  }
  function sync() {
    document.querySelectorAll(".bar button[data-k]").forEach(b => {
      const k = b.dataset.k, v = b.dataset.v;
      b.setAttribute("aria-pressed", String(k === "period" ? S.period === v : k === "night" ? String(+S.night) === v : k === "run" ? S.run : S.size === v));
    });
    const rb = document.getElementById("runBtn");
    rb.disabled = S.period === "pred"; rb.title = rb.disabled ? "Časovač je v ukážke po pôrode (Spánok)." : "";
    const q = new URLSearchParams({ period: S.period }); if (S.night) q.set("night", 1); if (S.run) q.set("run", 1); if (S.size !== "390") q.set("size", S.size);
    try { history.replaceState(null, "", "?" + q); } catch (e) { /* náhľad zo súboru */ }
  }
  const rerender = () => rings.forEach(r => { r.ph.classList.toggle("night", S.night); r.open = false; r.el.classList.remove("open"); r.render(); });

  const App = {
    openSheet(ring, k, i) {
      const ph = ring.ph, sh = ph.querySelector(".sheet"), scrim = ph.querySelector(".scrim"), tid = sh.getAttribute("aria-labelledby");
      let head, body;
      if (k === "day") {
        head = ["Náš deň", "moon"];
        body = "<ul class='day-list'>" + QUICK.map(q => { const t = ago(q.k); return "<li><span class='sh-ic'>" + icon(q.icon) + "</span><b>" + q.label + "</b><span>" + (t || "dnes zatiaľ nie") + "</span></li>"; }).join("") + "</ul>" +
          "<p class='sh-note'>Celý deň po hodinách a poslanie prehľadu blízkym. <span class='tag'>[ukážka]</span></p><button type='button' class='save' data-close>Zavrieť</button>";
      } else if (k === "prep") {
        const s = PREP[i];
        head = [s.label, s.icon];
        body = "<p class='sh-note'>Tu sa otvorí Plán – " + s.label + ". <span class='tag'>[ukážka]</span></p><button type='button' class='save' data-close>Otvoriť Plán</button>";
      } else {
        const d = SHEETS[k];
        head = [d.t, d.ic];
        body = "<div class='chips' role='group' aria-label='" + d.t + "'>" + d.chips.map((c, j) => "<button type='button' class='chip' aria-pressed='" + (j === 0) + "' data-j='" + j + "'>" + c + "</button>").join("") + "</div>" + (d.note ? "<p class='sh-note'>" + d.note + "</p>" : "") + "<button type='button' class='save' data-save>Uložiť</button>";
      }
      sh.innerHTML = "<div class='sh-head'><span class='sh-ic'>" + icon(head[1]) + "</span><h3 id='" + tid + "'>" + head[0] + "</h3><button type='button' class='x' data-close aria-label='Zavrieť'>" + icon("close") + "</button></div>" + body;
      sh.classList.add("open"); scrim.classList.add("open");
      const close = () => { sh.classList.remove("open"); scrim.classList.remove("open"); sh.onclick = null; scrim.onclick = null; ph.onkeydown = null; ring.core.focus({ preventScroll: true }); };
      scrim.onclick = close;
      ph.onkeydown = e => { if (e.key === "Escape") close(); };
      sh.onclick = e => {
        const c = e.target.closest(".chip");
        if (c) { sh.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === c))); return; }
        if (e.target.closest("[data-close]")) return close();
        if (e.target.closest("[data-save]")) { const j = +(sh.querySelector(".chip[aria-pressed='true']")?.dataset.j || 0); close(); App.save(ring, k, j); }
      };
      setTimeout(() => sh.querySelector(".chip, .save")?.focus({ preventScroll: true }), reduced ? 0 : 300);
    },
    snapshot() { const now = Date.now(), last = {}; Object.keys(S.last).forEach(k => { last[k] = S.last[k] + (now - S.lastAt) / 60000; }); return { last, run: S.run, base: S.runBase, since: S.runSince }; },
    restore(p) { S.last = p.last; S.lastAt = Date.now(); S.run = p.run; S.runBase = p.base; S.runSince = p.since; },
    save(ring, k, j) {
      const prev = App.snapshot();
      if (S.last[k] != null) { S.last = prev.last; S.last[k] = 0; S.lastAt = Date.now(); }
      if (k === "sleep" && j === 0) { S.run = true; S.runBase = 0; S.runSince = Date.now(); }
      sync(); rerender(); rings.forEach(r => r.pulse(k));
      App.toast(ring, () => App.restore(prev));
    },
    stopTimer(ring) {
      const prev = App.snapshot();
      S.run = false; S.last = prev.last; S.last.sleep = 0; S.lastAt = Date.now();
      sync(); rerender(); rings.forEach(r => r.pulse("sleep"));
      App.toast(ring, () => App.restore(prev));
    },
    toast(ring, undo) {
      const t = ring.ph.querySelector(".toast");
      t.innerHTML = "<span>Uložené</span><button type='button'>Vrátiť</button>";
      t.classList.add("show"); ring.live.textContent = "Uložené.";
      clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 5000);
      t.querySelector("button").onclick = () => { undo(); t.classList.remove("show"); sync(); rerender(); ring.live.textContent = "Vrátené."; };
    }
  };

  document.querySelector(".bar").addEventListener("click", e => {
    const b = e.target.closest("button[data-k]"); if (!b || b.disabled) return;
    const k = b.dataset.k, v = b.dataset.v;
    if (k === "period") S.period = v;
    if (k === "night") S.night = v === "1";
    if (k === "run") { S.run = !S.run; S.runBase = 47 * 60; S.runSince = Date.now(); }
    if (k === "size") { S.size = v; sync(); build(); return; }
    sync();
    if (k === "period") rings.forEach(r => { r.first = true; });
    rerender();
  });
  document.addEventListener("pointerdown", e => rings.forEach(r => { if (r.open && !r.el.contains(e.target)) r.closeBloom(); }), true);
  document.addEventListener("keydown", e => { if (e.key === "Escape") rings.forEach(r => r.closeBloom(true)); });
  setInterval(() => rings.forEach(r => r.tick()), 1000);

  sync(); build();
})();
</script>
</body>
</html>

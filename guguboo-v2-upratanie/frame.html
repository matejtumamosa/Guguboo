<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guguboo V2 – upratanie (náhľad)</title>
  <!-- V2 – rámček telefónu pre širokú obrazovku (Samuel 10. 11. 2026). Appka beží vo vnútri ako na mobile.
       Telefón má vždy skutočnú veľkosť (bez zmenšovania – systémové okienka výberu a dátumu by inak vyskočili obrovské).
       Výška 780–900 px; pri nižšom okne sa stránka s telefónom dá posunúť. -->
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
      box-sizing: border-box;
      background: radial-gradient(circle at 20% 15%, #f6f0ff 0, transparent 45%), radial-gradient(circle at 85% 85%, #fff1ec 0, transparent 45%), #fbf8f6;
    }
    .phone {
      display: block;
      flex: 0 0 auto;
      width: 430px;
      height: clamp(780px, calc(100vh - 40px), 900px);
      border: 0;
      border-radius: 36px;
      background: #fff;
      box-shadow: 0 30px 80px rgba(48, 36, 67, .18), 0 0 0 10px #fff, 0 0 0 11px rgba(123, 97, 200, .14);
    }
  </style>
</head>
<body>
  <iframe class="phone" src="app.html?frame=1" title="Guguboo" allow="microphone; camera; clipboard-write; web-share; fullscreen"></iframe>
  <script>
    // Hash (#...) z adresy pošli do appky v rámčeku.
    if (window.location.hash) document.querySelector(".phone").src = "app.html?frame=1" + window.location.hash;
  </script>
</body>
</html>
